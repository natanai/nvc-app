<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="allneeds.app social card">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F6F8"/>

  <!-- Three flush arched doors (ink / rose / mint) -->
  <g transform="translate(120,105)">
    <!-- 180w × 360h, radius 90; doors are flush with each other -->
    <path d="M0,360 V90 A90,90 0 0 1 180,90 V360 Z" fill="#5f65b5"/>
    <path d="M180,360 V90 A90,90 0 0 1 360,90 V360 Z" fill="#e19bd9"/>
    <path d="M360,360 V90 A90,90 0 0 1 540,90 V360 Z" fill="#8fe1b5"/>
  </g>

  <!-- Text block on the right -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     fill="#111111">
    <!-- Title: constrained to 430px width so it can't clip on the right -->
    <text x="700" y="260"
          font-size="72" font-weight="700"
          textLength="430" lengthAdjust="spacingAndGlyphs">
      allneeds.app
    </text>

    <!-- Subtitle: also constrained to 430px -->
    <text x="700" y="340"
          font-size="40" font-weight="400"
          textLength="430" lengthAdjust="spacingAndGlyphs">
      Observations • Feelings • Needs
    </text>
  </g>
</svg>
