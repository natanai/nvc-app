name: Apply Fact-Checking Spreadsheets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      commit_message:
        description: "Commit message for the generated changes"
        required: false
        default: "Apply fact-checking spreadsheets"

permissions:
  contents: write

concurrency:
  group: fact-checking-import-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  import-fact-checking:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fact-checking spreadsheets
        run: npm run import:fact-checking

      - name: Propagate citation updates and rebuild site artifacts
        run: |
          npm run replace:needs-sources
          npm run build:data
          npm run build:pages

      - name: Commit applied data
        id: commit
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit after applying fact-checking spreadsheets."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Push updates
        if: steps.commit.outputs.changes == 'true'
        run: git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Summarize run
        run: |
          if [ "${{ steps.commit.outputs.changes }}" = "true" ]; then
            SUMMARY="Applied fact-checking spreadsheets, refreshed needs citations, rebuilt data + pages, and pushed changes to ${{ env.TARGET_BRANCH }}."
          else
            SUMMARY="No updates detected after running the fact-checking import; nothing was pushed."
          fi

          {
            echo "## Apply Fact-Checking Spreadsheets"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
