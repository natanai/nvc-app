name: Apply Fact-Checking Spreadsheets

on:
  workflow_dispatch:
    inputs:
      commit-message:
        description: "Commit message for the generated changes"
        required: false
        default: "Apply fact-checking spreadsheets"
      base-branch:
        description: "Branch to apply the fact-checking spreadsheets to (defaults to the repository's default branch if omitted)"
        required: false

permissions:
  contents: write

jobs:
  import-fact-checking:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.inputs.base-branch || github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fact-checking spreadsheets
        run: npm run import:fact-checking

      - name: Rebuild dataset and pages
        run: |
          npm run build:data
          npm run build:pages

      - name: Commit applied data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ github.event.inputs.commit-message }}
          branch: ${{ env.TARGET_BRANCH }}
