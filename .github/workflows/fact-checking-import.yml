name: Apply Fact-Checking Spreadsheets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      commit_message:
        description: "Commit message for the generated changes"
        required: false
        default: "Apply fact-checking spreadsheets"

permissions:
  contents: write

concurrency:
  group: fact-checking-import-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  import-fact-checking:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fact-checking export is current
        run: node scripts/fact-checking-manifest.mjs check

      - name: Apply fact-checking spreadsheets
        run: npm run import:fact-checking

      - name: Propagate citation updates and rebuild owned site artifacts
        run: |
          npm run replace:needs-sources
          npm run build:data
          npm run build:pages

      - name: Verify import ownership
        run: |
          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              _evidence/citations.csv|\
              data/Needs.csv|data/Feelings.csv|data/Faux\ Feelings.csv|data/Strategies.csv|data/color-palettes.csv|\
              data/index.json|data/body-regions.json|\
              data/observation_taxonomy.json|data/observation_lexicon.json|data/observation_need_templates.json|\
              data/observation_module_blueprints.json|data/observation_detector_stats.json|data/observation-guide.json|\
              index.html|faux-feelings/index.html|faux-feelings/*/index.html|\
              feelings/index.html|feelings/body-cues/index.html|feelings/*/index.html|\
              needs/index.html|needs/*/index.html|\
              inventory/index.html|inventory/journal/index.html|\
              observations/index.html|alexithymia-support/index.html)
                if [[ "$path" == "feelings/emotions-wheel/index.html" ]]; then
                  echo "::error title=Protected route changed::Fact-checking import must not rewrite feelings/emotions-wheel/index.html."
                  unexpected=1
                fi
                ;;
              *)
                echo "::error title=Fact-checking import escaped its ownership::Unexpected changed path: $path"
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$unexpected"

      - name: Commit applied data
        id: commit
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit after applying fact-checking spreadsheets."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Push updates
        if: steps.commit.outputs.changes == 'true'
        run: git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Summarize run
        run: |
          if [ "${{ steps.commit.outputs.changes }}" = "true" ]; then
            SUMMARY="Applied a freshness-verified fact-checking export, refreshed owned data/pages, and pushed changes to ${{ env.TARGET_BRANCH }}. Body Cues remains sourced from data/Feelings.csv; reverse-inference and body-regions snapshot CSVs are reference-only."
          else
            SUMMARY="No updates detected after running the freshness-verified fact-checking import; nothing was pushed."
          fi

          {
            echo "## Apply Fact-Checking Spreadsheets"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
