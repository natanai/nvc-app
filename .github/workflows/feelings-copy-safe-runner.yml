name: Isolated feelings-only copy runner

on:
  pull_request:
    branches: [ux-audit]
    paths:
      - '.github/feelings-copy-safe-trigger'

permissions:
  contents: write

jobs:
  patch-feelings:
    if: github.event.pull_request.head.ref == 'ux-audit-feelings-copy-safe-run-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source copy changes without runtime text swapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          generator = Path('scripts/build-pages.mjs')
          generator_before = generator.read_text()
          old_static = '<span class="feeling-inference-toggle__label">How this feeling might be inferred</span>'
          new_static = '<span class="feeling-inference-toggle__label">How this feeling may show up</span>'
          if generator_before.count(old_static) != 1:
              raise SystemExit(f'Expected exactly one old static inference label in {generator}; found {generator_before.count(old_static)}')
          generator.write_text(generator_before.replace(old_static, new_static, 1))

          runtime = Path('scripts/feeling-reverse-inference.js')
          runtime_before = runtime.read_text()
          runtime_pattern = re.compile(
              r"\n  const toggleLabel = toggle\.querySelector\('\.feeling-inference-toggle__label'\);\n"
              r"  if \(toggleLabel\) \{\n"
              r"    toggleLabel\.textContent = 'How this feeling may show up';\n"
              r"  \}\n"
          )
          matches = runtime_pattern.findall(runtime_before)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one runtime label-rewrite block in {runtime}; found {len(matches)}')
          runtime_after = runtime_pattern.sub('\n', runtime_before, count=1)

          required_copy = [
              "'Typical intensity'",
              "'Typical pattern'",
              "'Possible body cues'",
              "'Relative importance'",
              "'Possible patterns—not rules or diagnoses. Your experience may differ.'",
          ]
          missing = [item for item in required_copy if item not in runtime_after]
          if missing:
              raise SystemExit(f'Expected tightened inference copy is missing from {runtime}: {missing}')
          runtime.write_text(runtime_after)
          PY

      - name: Probe the scoped generator in a disposable worktree
        run: |
          set -euo pipefail
          PROBE_DIR="$(mktemp -d)"
          echo "$PROBE_DIR" > "$RUNNER_TEMP/feelings_probe_dir"
          git worktree add --detach "$PROBE_DIR" HEAD
          cp scripts/build-pages.mjs "$PROBE_DIR/scripts/build-pages.mjs"
          (cd "$PROBE_DIR" && node scripts/build-pages.mjs --scope feelings)
          echo 'Scoped generator probe completed in disposable worktree.'

      - name: Audit generator probe and patch existing pages precisely
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          old = '<span class="feeling-inference-toggle__label">How this feeling might be inferred</span>'
          new = '<span class="feeling-inference-toggle__label">How this feeling may show up</span>'
          probe = Path((Path(os.environ['RUNNER_TEMP']) / 'feelings_probe_dir').read_text().strip())

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          targets = []
          for path in tracked:
              if not (path.startswith('feelings/') and path.endswith('/index.html')):
                  continue
              before = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
              if old in before:
                  if before.count(old) != 1:
                      raise SystemExit(f'{path}: expected one old inference label, found {before.count(old)}')
                  targets.append(path)
          if not targets:
              raise SystemExit('No existing feeling pages contain the old static inference label.')

          probe_deleted = subprocess.check_output(
              ['git', '-C', str(probe), 'diff', '--name-only', '--diff-filter=D', '--', 'feelings'], text=True
          ).splitlines()
          probe_drift = []
          missing_targets = []
          for path in targets:
              before = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
              expected = before.replace(old, new, 1)
              probe_path = probe / path
              if not probe_path.exists():
                  missing_targets.append(path)
                  continue
              generated = probe_path.read_text()
              if new not in generated:
                  raise SystemExit(f'{path}: patched generator did not emit the new static label')
              if generated != expected:
                  probe_drift.append(path)
          if missing_targets:
              raise SystemExit('Scoped generator failed to regenerate expected feeling pages:\n' + '\n'.join(missing_targets[:20]))

          print(f'Generator probe would delete {len(probe_deleted)} tracked feeling-path file(s).')
          for path in probe_deleted[:30]:
              print(f'  DELETE (quarantined): {path}')
          print(f'Generator probe has unrelated output drift on {len(probe_drift)} of {len(targets)} target pages.')
          for path in probe_drift[:20]:
              print(f'  DRIFT (not committed): {path}')

          for path in targets:
              page = Path(path)
              current = page.read_text()
              if current.count(old) != 1:
                  raise SystemExit(f'{path}: working tree no longer has exactly one old label')
              page.write_text(current.replace(old, new, 1))

          Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').write_text('\n'.join(targets) + '\n')
          print(f'Precisely patched {len(targets)} existing feeling pages; destructive probe output remains quarantined.')
          PY

      - name: Remove disposable generator worktree
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/feelings_probe_dir" ]; then
            PROBE_DIR="$(cat "$RUNNER_TEMP/feelings_probe_dir")"
            git worktree remove --force "$PROBE_DIR" || true
          fi

      - name: Fail closed on any unexpected working-tree diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          old = '<span class="feeling-inference-toggle__label">How this feeling might be inferred</span>'
          new = '<span class="feeling-inference-toggle__label">How this feeling may show up</span>'
          targets = [p for p in Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').read_text().splitlines() if p]
          allowed = set(targets) | {'scripts/build-pages.mjs', 'scripts/feeling-reverse-inference.js'}
          status = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          dirty = []
          for line in status:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              dirty.append(path)
          unexpected = sorted(set(dirty) - allowed)
          if unexpected:
              raise SystemExit('Unexpected paths changed; refusing to continue:\n' + '\n'.join(unexpected))

          generator_before = subprocess.check_output(['git', 'show', 'HEAD:scripts/build-pages.mjs'], text=True)
          if Path('scripts/build-pages.mjs').read_text() != generator_before.replace(old, new, 1):
              raise SystemExit('build-pages.mjs changed beyond the single approved static-label replacement')

          runtime_before = subprocess.check_output(['git', 'show', 'HEAD:scripts/feeling-reverse-inference.js'], text=True)
          runtime_pattern = re.compile(
              r"\n  const toggleLabel = toggle\.querySelector\('\.feeling-inference-toggle__label'\);\n"
              r"  if \(toggleLabel\) \{\n"
              r"    toggleLabel\.textContent = 'How this feeling may show up';\n"
              r"  \}\n"
          )
          expected_runtime, count = runtime_pattern.subn('\n', runtime_before, count=1)
          if count != 1 or Path('scripts/feeling-reverse-inference.js').read_text() != expected_runtime:
              raise SystemExit('feeling-reverse-inference.js changed beyond removal of the runtime text swap')

          for path in targets:
              before = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
              if Path(path).read_text() != before.replace(old, new, 1):
                  raise SystemExit(f'{path}: changed beyond the single approved static-label replacement')

          if subprocess.check_output(['git', 'status', '--porcelain=v1', '--', 'inventory/'], text=True).strip():
              raise SystemExit('Inventory changed unexpectedly.')
          print(f'Final diff allowlist passed for {len(targets)} feeling pages + 2 source files. Inventory is untouched.')
          PY

      - name: Compare data-integrity result with unmodified baseline
        run: |
          set -u
          BASELINE_DIR="$(mktemp -d)"
          git worktree add --detach "$BASELINE_DIR" HEAD

          set +e
          (cd "$BASELINE_DIR" && npm run test:data-integrity > "$RUNNER_TEMP/baseline-integrity.log" 2>&1)
          BASELINE_CODE=$?
          npm run test:data-integrity > "$RUNNER_TEMP/patched-integrity.log" 2>&1
          PATCHED_CODE=$?
          set -e

          if [ "$PATCHED_CODE" -ne "$BASELINE_CODE" ]; then
            echo "Data-integrity exit changed: baseline=$BASELINE_CODE patched=$PATCHED_CODE" >&2
            cat "$RUNNER_TEMP/patched-integrity.log" >&2
            exit 1
          fi

          BASE_REPORT="$BASELINE_DIR/data/reports/data-integrity-report.md"
          PATCHED_REPORT="data/reports/data-integrity-report.md"
          if [ -f "$BASE_REPORT" ] && [ -f "$PATCHED_REPORT" ]; then
            sed '/^Generated: /d' "$BASE_REPORT" > "$RUNNER_TEMP/baseline-integrity-normalized.md"
            sed '/^Generated: /d' "$PATCHED_REPORT" > "$RUNNER_TEMP/patched-integrity-normalized.md"
            if ! cmp -s "$RUNNER_TEMP/baseline-integrity-normalized.md" "$RUNNER_TEMP/patched-integrity-normalized.md"; then
              echo 'Data-integrity report changed relative to baseline beyond its timestamp.' >&2
              diff -u "$RUNNER_TEMP/baseline-integrity-normalized.md" "$RUNNER_TEMP/patched-integrity-normalized.md" || true
              exit 1
            fi
          elif [ -f "$BASE_REPORT" ] || [ -f "$PATCHED_REPORT" ]; then
            echo 'Data-integrity report presence changed relative to baseline.' >&2
            exit 1
          fi

          BASE_MISSING="$BASELINE_DIR/data/reports/missing-vocabulary.csv"
          PATCHED_MISSING="data/reports/missing-vocabulary.csv"
          if [ -f "$BASE_MISSING" ] && [ -f "$PATCHED_MISSING" ]; then
            if ! cmp -s "$BASE_MISSING" "$PATCHED_MISSING"; then
              echo 'Missing-vocabulary report changed relative to baseline.' >&2
              diff -u "$BASE_MISSING" "$PATCHED_MISSING" || true
              exit 1
            fi
          elif [ -f "$BASE_MISSING" ] || [ -f "$PATCHED_MISSING" ]; then
            echo 'Missing-vocabulary report presence changed relative to baseline.' >&2
            exit 1
          fi

          echo "Data-integrity result matches baseline (exit $PATCHED_CODE); no new integrity findings were introduced."
          git worktree remove --force "$BASELINE_DIR"

          for report in data/reports/data-integrity-report.md data/reports/missing-vocabulary.csv; do
            if git ls-files --error-unmatch "$report" >/dev/null 2>&1; then
              git restore --source=HEAD -- "$report"
            else
              rm -f "$report"
            fi
          done

      - name: Run remaining non-destructive checks
        run: |
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run lint:entrypoints

      - name: Verify tests created no unexpected changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          targets = [p for p in Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').read_text().splitlines() if p]
          allowed = set(targets) | {'scripts/build-pages.mjs', 'scripts/feeling-reverse-inference.js'}
          status = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          dirty = []
          for line in status:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              dirty.append(path)
          unexpected = sorted(set(dirty) - allowed)
          if unexpected:
              raise SystemExit('Tests left unexpected changes; refusing to commit:\n' + '\n'.join(unexpected))
          if any(path.startswith('inventory/') for path in dirty):
              raise SystemExit('Inventory changed unexpectedly; refusing to commit.')
          print('Post-test working tree remains within the approved allowlist; Inventory is untouched.')
          PY

      - name: Remove trigger and commit guarded result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/feelings-copy-safe-trigger
          git add scripts/build-pages.mjs scripts/feeling-reverse-inference.js feelings
          git commit -m 'Apply feeling inference copy without runtime swap'

      - name: Push only if isolated PR branch has not moved
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin ux-audit-feelings-copy-safe-run-2
          REMOTE_SHA="$(git rev-parse origin/ux-audit-feelings-copy-safe-run-2)"
          if [ "$REMOTE_SHA" != "$EXPECTED_HEAD" ]; then
            echo "Isolated branch moved from $EXPECTED_HEAD to $REMOTE_SHA; refusing to overwrite it." >&2
            exit 1
          fi
          git push origin HEAD:ux-audit-feelings-copy-safe-run-2
