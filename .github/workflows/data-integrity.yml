name: Data Integrity

on:
  workflow_dispatch:

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build data index
        run: npm run build:data

      - name: Run data integrity checks
        run: npm run test:data-integrity

      - name: Upload missing vocabulary spreadsheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-vocabulary
          path: data/reports/missing-vocabulary.csv
          if-no-files-found: warn

      - name: Upload data integrity report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report
          path: data/reports/data-integrity-report.md
          if-no-files-found: warn
