name: Bedrock desktop finalization runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply desktop Bedrock finalization
        shell: bash
        run: |
          if [ -f .github/scripts/bedrock-desktop-finalize-preflight.mjs ]; then
            node .github/scripts/bedrock-desktop-finalize-preflight.mjs
            rm .github/scripts/bedrock-desktop-finalize-preflight.mjs
          fi
          node .github/scripts/bedrock-desktop-finalize.mjs
          rm .github/scripts/bedrock-desktop-finalize.mjs
          npm ci --ignore-scripts
          node --check assets/js/catalog-multiselect.js
          node --check assets/js/journal/module.js
          node --check scripts/inventory.js
          node --check scripts/magnets.js
          npm run build:pages
          node --test tests/desktop-bedrock-finalization.test.mjs tests/final-hierarchy-ux.test.mjs
          npm run build
          npm run test:flicker-jitter
          npm run test:performance
          npm run test:generator-ownership
          npm run test:obsolete
      - name: Commit finalized Bedrock changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize desktop Bedrock consistency" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
