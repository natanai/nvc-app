name: Site Quality Checks

on:
  push:
    branches: [backend, ux-audit, main, work]
  pull_request:
    branches: [backend, main, work]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against (defaults to backend)'
        required: false
        default: backend

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify data integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        run: npm run test:customizer

      - name: Verify Inventory pre-paint styling
        run: node tests/inventory-prepaint-style.test.mjs

      - name: Run flicker and jitter checker
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        run: npm run test:nav-magnets
