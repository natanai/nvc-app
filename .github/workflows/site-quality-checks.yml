name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validate the exact committed static site first. The authoring build below
      # is intentionally allowed to mutate the checkout so its reproducibility
      # can be checked independently without contaminating runtime regressions.
      - name: Verify data integrity
        id: data-integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Verify static layout contracts
        id: static-layout-contracts
        if: always()
        run: |
          node --test tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs

      - name: Verify page generator ownership
        id: generator-ownership
        if: always()
        run: npm run test:generator-ownership

      - name: Build site
        id: build-site
        if: always()
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the committed/live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Summarize site quality
        if: always()
        run: |
          echo "Committed data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Committed customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Committed flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Committed navigation magnets: ${{ steps.navigation-magnets.outcome }}"
          echo "Committed static layout contracts: ${{ steps.static-layout-contracts.outcome }}"
          echo "Page generator ownership: ${{ steps.generator-ownership.outcome }}"
          echo "Authoring build: ${{ steps.build-site.outcome }}"
          echo "Build reproducibility: ${{ steps.generated-artifacts.outcome }}"

          if [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ] \
            && [ "${{ steps.static-layout-contracts.outcome }}" = "success" ] \
            && [ "${{ steps.generator-ownership.outcome }}" = "success" ]; then
            echo "Committed static-site runtime and generator ownership checks passed."
          else
            echo "One or more committed-site checks failed; inspect those before publishing this branch."
          fi

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ]; then
            echo "Authoring pipeline is reproducible."
          else
            echo "Authoring pipeline has reproducibility debt; see the build/artifact check above."
          fi

  canonicalize-data-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch normalization and reviewed overrides into canonical compiler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-data.mjs')
          source = path.read_text()

          anchor = "const DATA_DIR = join(ROOT, 'data');\n"
          insertion = """const DATA_DIR = join(ROOT, 'data');

const PAGE_TO_MODEL_KEY = new Map([
  ['excited', 'excitement'],
  ['joyful', 'joy'],
  ['hopeful', 'hope'],
  ['contented', 'contentment'],
]);
const MODEL_TO_PAGE_KEY = new Map(
  Array.from(PAGE_TO_MODEL_KEY.entries(), ([pageKey, modelKey]) => [modelKey, pageKey]),
);
"""
          if 'const PAGE_TO_MODEL_KEY = new Map([' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(f'Expected one DATA_DIR anchor, found {source.count(anchor)}')
              source = source.replace(anchor, insertion, 1)

          function_anchor = "function buildBodyRegions(rows) {\n"
          function_insertion = """function normalizeCueFeelingKey(value) {
  const key = String(value || '').trim();
  return key === 'love' ? 'love-caring' : key;
}

function buildBodyRegions(rows) {
"""
          if 'function normalizeCueFeelingKey(value)' not in source:
              if source.count(function_anchor) != 1:
                  raise SystemExit(f'Expected one buildBodyRegions anchor, found {source.count(function_anchor)}')
              source = source.replace(function_anchor, function_insertion, 1)

          old_cue = """    const feelingKey = row['Cue Feeling Key'];
    const weight = Number(row['Cue Weight']);
    if (feelingKey && Number.isFinite(weight) && weight > 0) {
      option.emotions[feelingKey] = weight;
    }
"""
          new_cue = """    const feelingKey = normalizeCueFeelingKey(row['Cue Feeling Key']);
    const weight = Number(row['Cue Weight']);
    if (feelingKey && Number.isFinite(weight) && weight > 0) {
      const previous = option.emotions[feelingKey];
      option.emotions[feelingKey] = Number.isFinite(previous) ? Math.max(previous, weight) : weight;
    }
"""
          if new_cue not in source:
              if source.count(old_cue) != 1:
                  raise SystemExit(f'Expected one cue assignment block, found {source.count(old_cue)}')
              source = source.replace(old_cue, new_cue, 1)

          helpers_anchor = "const bodyRegions = buildBodyRegions(rawCueRows);\n"
          helpers = r"""const bodyRegions = buildBodyRegions(rawCueRows);

function bodyRegionsForInference(regions) {
  return regions.map((region) => ({
    ...region,
    options: (region.options || []).map((option) => {
      const emotions = {};
      for (const [pageKey, weight] of Object.entries(option.emotions || {})) {
        const modelKey = PAGE_TO_MODEL_KEY.get(pageKey) || pageKey;
        const existing = emotions[modelKey];
        emotions[modelKey] = Number.isFinite(existing) ? Math.max(existing, weight) : weight;
      }
      return { ...option, emotions };
    }),
  }));
}

function restorePageFacingInferenceKeys(index) {
  const output = {};

  for (const [modelKey, value] of Object.entries(index)) {
    if (modelKey === '_meta') continue;
    const pageKey = MODEL_TO_PAGE_KEY.get(modelKey) || modelKey;
    const entry = value && typeof value === 'object' ? { ...value } : value;

    if (entry && Array.isArray(entry.evidenceKeys)) {
      entry.evidenceKeys = entry.evidenceKeys.map((key) =>
        key === `emotion-${modelKey}` ? `emotion-${pageKey}` : key,
      );
    }
    output[pageKey] = entry;
  }

  if (index._meta) output._meta = index._meta;
  return output;
}

function cloneJson(value) {
  return JSON.parse(JSON.stringify(value));
}

function applyReverseInferenceOverrides(index, source) {
  if (!source || source.schemaVersion !== 1 || !source.entries || typeof source.entries !== 'object') {
    throw new Error('data/reverse-inference-overrides.json must use schemaVersion 1 with an entries object.');
  }

  const output = cloneJson(index);
  const allowedFields = new Set([
    'zones',
    'needsHypotheses',
    'bodyCueOrder',
    'bodyCueOverrides',
    'evidenceKeysAppend',
  ]);

  for (const [pageKey, override] of Object.entries(source.entries)) {
    const entry = output[pageKey];
    if (!entry || pageKey === '_meta') {
      throw new Error(`Reverse-inference override references unknown generated feeling "${pageKey}".`);
    }
    if (!override || typeof override !== 'object' || Array.isArray(override)) {
      throw new Error(`Reverse-inference override for "${pageKey}" must be an object.`);
    }

    const unknownFields = Object.keys(override).filter((field) => !allowedFields.has(field));
    if (unknownFields.length) {
      throw new Error(`Reverse-inference override for "${pageKey}" has unknown field(s): ${unknownFields.join(', ')}.`);
    }

    if (Object.hasOwn(override, 'zones')) {
      if (!Array.isArray(override.zones)) throw new Error(`Override zones for "${pageKey}" must be an array.`);
      entry.zones = cloneJson(override.zones);
    }

    if (Object.hasOwn(override, 'needsHypotheses')) {
      if (!override.needsHypotheses || typeof override.needsHypotheses !== 'object' || Array.isArray(override.needsHypotheses)) {
        throw new Error(`Override needsHypotheses for "${pageKey}" must be an object.`);
      }
      entry.needsHypotheses = cloneJson(override.needsHypotheses);
    }

    const originalBodyCues = Array.isArray(entry.bodyCues) ? entry.bodyCues.map((cue) => cloneJson(cue)) : [];
    const originalEvidenceKeys = new Set(originalBodyCues.map((cue) => cue.evidenceKey).filter(Boolean));
    let bodyCues = originalBodyCues;
    let bodyCueChanged = false;

    if (Object.hasOwn(override, 'bodyCueOrder')) {
      if (!Array.isArray(override.bodyCueOrder)) {
        throw new Error(`Override bodyCueOrder for "${pageKey}" must be an array.`);
      }
      if (new Set(override.bodyCueOrder).size !== override.bodyCueOrder.length) {
        throw new Error(`Override bodyCueOrder for "${pageKey}" contains duplicate option IDs.`);
      }
      const byId = new Map(originalBodyCues.map((cue) => [cue.optionId, cue]));
      bodyCues = override.bodyCueOrder.map((optionId) => {
        const cue = byId.get(optionId);
        if (!cue) throw new Error(`Override bodyCueOrder for "${pageKey}" references unknown cue "${optionId}".`);
        return cloneJson(cue);
      });
      bodyCueChanged = true;
    }

    if (Object.hasOwn(override, 'bodyCueOverrides')) {
      if (!override.bodyCueOverrides || typeof override.bodyCueOverrides !== 'object' || Array.isArray(override.bodyCueOverrides)) {
        throw new Error(`Override bodyCueOverrides for "${pageKey}" must be an object.`);
      }
      const available = new Set(bodyCues.map((cue) => cue.optionId));
      for (const optionId of Object.keys(override.bodyCueOverrides)) {
        if (!available.has(optionId)) {
          throw new Error(`Override bodyCueOverrides for "${pageKey}" references unavailable cue "${optionId}".`);
        }
      }
      bodyCues = bodyCues.map((cue) => {
        const patch = override.bodyCueOverrides[cue.optionId];
        return patch ? { ...cue, ...cloneJson(patch) } : cue;
      });
      bodyCueChanged = true;
    }

    if (bodyCueChanged) {
      entry.bodyCues = bodyCues;
      const nonBodyEvidence = (entry.evidenceKeys || []).filter((key) => !originalEvidenceKeys.has(key));
      entry.evidenceKeys = [
        ...nonBodyEvidence,
        ...bodyCues.map((cue) => cue.evidenceKey).filter(Boolean),
      ];
    }

    if (Object.hasOwn(override, 'evidenceKeysAppend')) {
      if (!Array.isArray(override.evidenceKeysAppend)) {
        throw new Error(`Override evidenceKeysAppend for "${pageKey}" must be an array.`);
      }
      entry.evidenceKeys = Array.from(new Set([...(entry.evidenceKeys || []), ...override.evidenceKeysAppend]));
    }
  }

  return output;
}
"""
          if 'function applyReverseInferenceOverrides(index, source)' not in source:
              if source.count(helpers_anchor) != 1:
                  raise SystemExit(f'Expected one bodyRegions helper anchor, found {source.count(helpers_anchor)}')
              source = source.replace(helpers_anchor, helpers, 1)

          old_tail = """const reverseIndex = buildReverseInferenceIndex({ needs, feelings, bodyRegions });
writeFileSync(join(DATA_DIR, 'reverse-inference.json'), `${JSON.stringify(reverseIndex, null, 2)}\n`);
"""
          new_tail = """const modelBodyRegions = bodyRegionsForInference(bodyRegions);
const modelReverseIndex = buildReverseInferenceIndex({ needs, feelings, bodyRegions: modelBodyRegions });
const pageReverseIndex = restorePageFacingInferenceKeys(modelReverseIndex);
const reverseInferenceOverrides = JSON.parse(
  readFileSync(join(DATA_DIR, 'reverse-inference-overrides.json'), 'utf8'),
);
const reverseIndex = applyReverseInferenceOverrides(pageReverseIndex, reverseInferenceOverrides);
writeFileSync(join(DATA_DIR, 'reverse-inference.json'), `${JSON.stringify(reverseIndex, null, 2)}\n`);
"""
          if new_tail not in source:
              if source.count(old_tail) != 1:
                  raise SystemExit(f'Expected one reverse-index tail, found {source.count(old_tail)}')
              source = source.replace(old_tail, new_tail, 1)

          path.write_text(source)
          PY

          node --check scripts/build-data.mjs
          git diff --check

      - name: Prove direct compiler preserves production data semantics
        shell: bash
        run: |
          mkdir -p /tmp/bedrock-data-before
          cp data/index.json data/body-regions.json data/reverse-inference.json /tmp/bedrock-data-before/
          node scripts/build-data.mjs

          node - <<'NODE'
          const fs = require('node:fs');
          const { isDeepStrictEqual } = require('node:util');
          const files = ['index.json', 'body-regions.json', 'reverse-inference.json'];
          for (const file of files) {
            const beforeText = fs.readFileSync(`/tmp/bedrock-data-before/${file}`, 'utf8');
            const afterText = fs.readFileSync(`data/${file}`, 'utf8');
            const before = JSON.parse(beforeText);
            const after = JSON.parse(afterText);
            console.log(`${file}: exact=${beforeText === afterText} semantic=${isDeepStrictEqual(before, after)}`);
            if (!isDeepStrictEqual(before, after)) {
              console.error(`Direct compiler changed production semantics in ${file}.`);
              process.exitCode = 1;
            }
          }
          NODE

          node tests/data-integrity.test.mjs

          git checkout -- data/index.json data/body-regions.json data/reverse-inference.json
          changed="$(git diff --name-only)"
          if [ "$changed" != "scripts/build-data.mjs" ]; then
            echo "Unexpected changed paths after restoring generated data:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit canonical data compiler source only
        shell: bash
        run: |
          if git diff --quiet -- scripts/build-data.mjs; then
            echo "No compiler source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build-data.mjs
          git commit -m "Canonicalize Body Cues and reverse inference generation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
