name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The build changed tracked or untracked artifacts. Commit generated output before merging."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi

      - name: Verify full build is idempotent
        run: npm run verify:build-idempotent

      - name: Verify generator source-of-truth
        run: npm run test:generator-stability

      - name: Verify browser entrypoint graph
        run: node tests/entrypoint-integrity.test.mjs

      - name: Verify workflow safety contracts
        run: npm run test:workflow-safety

      - name: Verify internal links and fragments
        run: npm run test:internal-links

      - name: Verify static-first UI contracts
        run: |
          node tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs
          npm run test:home-regressions
          npm run test:obsolete

      - name: Verify data integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        run: npm run test:nav-magnets
