name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        id: build-site
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Verify data integrity
        id: data-integrity
        if: always()
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Summarize site quality
        if: always()
        run: |
          echo "Build: ${{ steps.build-site.outcome }}"
          echo "Generated artifacts: ${{ steps.generated-artifacts.outcome }}"
          echo "Data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Navigation magnets: ${{ steps.navigation-magnets.outcome }}"

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ] \
            && [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ]; then
            echo "All site quality checks passed."
          else
            echo "One or more site quality checks failed; see the individual red checks above."
          fi
