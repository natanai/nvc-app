name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validate the exact committed static site first. The authoring build below
      # is intentionally allowed to mutate the checkout so its reproducibility
      # can be checked independently without contaminating runtime regressions.
      - name: Verify data integrity
        id: data-integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Verify static layout contracts
        id: static-layout-contracts
        if: always()
        run: |
          node --test tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs

      - name: Build site
        id: build-site
        if: always()
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the committed/live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Summarize site quality
        if: always()
        run: |
          echo "Committed data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Committed customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Committed flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Committed navigation magnets: ${{ steps.navigation-magnets.outcome }}"
          echo "Committed static layout contracts: ${{ steps.static-layout-contracts.outcome }}"
          echo "Authoring build: ${{ steps.build-site.outcome }}"
          echo "Build reproducibility: ${{ steps.generated-artifacts.outcome }}"

          if [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ] \
            && [ "${{ steps.static-layout-contracts.outcome }}" = "success" ]; then
            echo "Committed static-site runtime checks passed."
          else
            echo "One or more committed-site checks failed; inspect those before publishing this branch."
          fi

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ]; then
            echo "Authoring pipeline is reproducible."
          else
            echo "Authoring pipeline has reproducibility debt; see the build/artifact check above."
          fi

  # BEDROCK_PROFILE_RESTORE_JOB_START
  bedrock-profile-restore-once:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'bedrock/production-finalization-v2' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply restore transaction repair
        run: |
          python scripts/bedrock-profile-restore-transaction.py
          git diff --check
          node --check scripts/inventory.js

      - name: Run protected suites
        run: |
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:home-regressions
          npm run test:nav-magnets
          npm run test:data-integrity

      - name: Prove authoring build remains byte-stable
        run: |
          git add scripts/inventory.js tests/profile-restore-rehydration.test.mjs
          npm run build
          git diff --exit-code

      - name: Commit validated repair and remove temporary machinery
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/site-quality-checks.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  # BEDROCK_PROFILE_RESTORE_JOB_START\n'
          if text.count(marker) != 1:
              raise SystemExit('Profile restore job marker missing or duplicated')
          path.write_text(text[:text.index(marker)].rstrip() + '\n', encoding='utf-8')
          PY
          rm scripts/bedrock-profile-restore-transaction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/site-quality-checks.yml scripts/inventory.js tests/profile-restore-rehydration.test.mjs scripts/bedrock-profile-restore-transaction.py
          git diff --cached --check
          git commit -m "Make profile restore transactional after sign-in"
          git push origin HEAD:bedrock/production-finalization-v2
