name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validate the exact committed static site first. The authoring build below
      # is intentionally allowed to mutate the checkout so its reproducibility
      # can be checked independently without contaminating runtime regressions.
      - name: Verify data integrity
        id: data-integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Verify static layout contracts
        id: static-layout-contracts
        if: always()
        run: |
          node --test tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs

      - name: Build site
        id: build-site
        if: always()
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the committed/live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Summarize site quality
        if: always()
        run: |
          echo "Committed data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Committed customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Committed flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Committed navigation magnets: ${{ steps.navigation-magnets.outcome }}"
          echo "Committed static layout contracts: ${{ steps.static-layout-contracts.outcome }}"
          echo "Authoring build: ${{ steps.build-site.outcome }}"
          echo "Build reproducibility: ${{ steps.generated-artifacts.outcome }}"

          if [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ] \
            && [ "${{ steps.static-layout-contracts.outcome }}" = "success" ]; then
            echo "Committed static-site runtime checks passed."
          else
            echo "One or more committed-site checks failed; inspect those before publishing this branch."
          fi

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ]; then
            echo "Authoring pipeline is reproducible."
          else
            echo "Authoring pipeline has reproducibility debt; see the build/artifact check above."
          fi

  # BEDROCK_ONE_TIME_PROFILE_RESTORE_START
  bedrock-profile-restore-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'bedrock/production-finalization-v2' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make full profile restore transactional
        run: |
          python - <<'PY'
          from pathlib import Path

          inventory_path = Path('scripts/inventory.js')
          inventory = inventory_path.read_text(encoding='utf-8')

          helper_anchor = """  return { success: true };
          }

          async function importLocalStorageSnapshot(payload) {
          """.replace('          ', '')
          helper_replacement = """  return { success: true };
          }

          function syncRestoredCustomizerMirrors(snapshot) {
            if (typeof window === 'undefined' || !window.sessionStorage) return;

            [THEME_STORAGE_KEY, NAV_SETTINGS_STORAGE_KEY].forEach((key) => {
              try {
                const value = snapshot?.[key];
                if (typeof value === 'string' && value.trim()) {
                  window.sessionStorage.setItem(key, value);
                } else {
                  window.sessionStorage.removeItem(key);
                }
              } catch (error) {
                console.warn(`Unable to synchronize restored customizer key ${key}`, error);
              }
            });
          }

          async function importLocalStorageSnapshot(payload) {
          """.replace('          ', '')
          if inventory.count(helper_anchor) != 1:
              raise SystemExit(f'Customizer mirror helper anchor count: {inventory.count(helper_anchor)}')
          inventory = inventory.replace(helper_anchor, helper_replacement)

          refresh_anchor = """  if (!replaceResult.success) {
            console.warn('Unable to apply localStorage backup', replaceResult.error);
            broadcastDataMessage('Import failed. Unable to write to localStorage.', 'error');
            return;
          }

          const counts = await refreshStateFromLocalStorageSnapshot(normalized.localStorage);
          """.replace('          ', '')
          refresh_replacement = """  if (!replaceResult.success) {
            console.warn('Unable to apply localStorage backup', replaceResult.error);
            broadcastDataMessage('Import failed. Unable to write to localStorage.', 'error');
            return;
          }

          // A full snapshot is authoritative. Theme and nav settings are mirrored
          // into sessionStorage during normal Customizer use, so update those
          // mirrors before the running page re-reads presentation state.
          syncRestoredCustomizerMirrors(normalized.localStorage);

          const counts = await refreshStateFromLocalStorageSnapshot(normalized.localStorage);
          """.replace('          ', '')
          if inventory.count(refresh_anchor) != 1:
              raise SystemExit(f'Restore refresh anchor count: {inventory.count(refresh_anchor)}')
          inventory = inventory.replace(refresh_anchor, refresh_replacement)

          signin_anchor = """    loadSnapshotFromBackend().catch((error) => {
                console.error('Failed to auto-load backend snapshot after sign-in', error);
              });
          """.replace('          ', '')
          signin_replacement = """    (async () => {
                // Automatic post-sign-in restore must use the same full-storage
                // guard as an explicit profile load. This prevents live magnet
                // persistence from racing the newly restored snapshot.
                const restoreModule = await import('./profile-restore-rehydration.js?v=2026-08-21-lazy');
                if (typeof restoreModule.installProfileRestoreRehydration === 'function') {
                  restoreModule.installProfileRestoreRehydration();
                }

                const guardedLoad = window.loadSnapshotFromBackend;
                if (
                  typeof guardedLoad !== 'function' ||
                  guardedLoad.__allneedsRestoreRehydrationWrapped !== true
                ) {
                  throw new Error('Profile restore guard did not attach before automatic sign-in restore');
                }

                await guardedLoad();
              })().catch((error) => {
                console.error('Failed to auto-load backend snapshot after sign-in', error);
              });
          """.replace('          ', '')
          if inventory.count(signin_anchor) != 1:
              raise SystemExit(f'Post-signin restore anchor count: {inventory.count(signin_anchor)}')
          inventory = inventory.replace(signin_anchor, signin_replacement)
          inventory_path.write_text(inventory, encoding='utf-8')

          test_path = Path('tests/profile-restore-rehydration.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test_name = "canonical snapshot replacement synchronizes Customizer mirrors before live rehydration"
          if test_name not in test:
              test += """

test('canonical snapshot replacement synchronizes Customizer mirrors before live rehydration', async () => {
  const inventory = await fs.readFile(path.join(root, 'scripts/inventory.js'), 'utf8');

  const helperIndex = inventory.indexOf('function syncRestoredCustomizerMirrors(snapshot)');
  const callIndex = inventory.indexOf('syncRestoredCustomizerMirrors(normalized.localStorage);');
  const refreshIndex = inventory.indexOf('const counts = await refreshStateFromLocalStorageSnapshot(normalized.localStorage);');

  assert.ok(helperIndex >= 0, 'canonical snapshot import must own Customizer mirror synchronization');
  assert.ok(inventory.includes('[THEME_STORAGE_KEY, NAV_SETTINGS_STORAGE_KEY].forEach((key) => {'));
  assert.ok(inventory.includes('window.sessionStorage.setItem(key, value)'));
  assert.ok(inventory.includes('window.sessionStorage.removeItem(key)'));
  assert.ok(callIndex >= 0 && refreshIndex > callIndex, 'session mirrors must match the imported snapshot before current-page theme/nav rehydration');
});

test('automatic post-sign-in profile restore installs the full restore guard first', async () => {
  const inventory = await fs.readFile(path.join(root, 'scripts/inventory.js'), 'utf8');

  const listenerIndex = inventory.indexOf("window.addEventListener('allneeds:bsky-login-changed'");
  const guardImportIndex = inventory.indexOf("import('./profile-restore-rehydration.js?v=2026-08-21-lazy')", listenerIndex);
  const wrappedCheckIndex = inventory.indexOf('guardedLoad.__allneedsRestoreRehydrationWrapped !== true', guardImportIndex);
  const loadIndex = inventory.indexOf('await guardedLoad();', wrappedCheckIndex);

  assert.ok(listenerIndex >= 0 && guardImportIndex > listenerIndex, 'sign-in restoration should prepare restore protection inside the login path');
  assert.ok(wrappedCheckIndex > guardImportIndex, 'automatic restore must verify that the backend loader is actually wrapped');
  assert.ok(loadIndex > wrappedCheckIndex, 'the saved profile may load only after restore protection is installed');
});
"""
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check
          node --check scripts/inventory.js

      - name: Run protected suites
        run: |
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:home-regressions
          npm run test:nav-magnets
          npm run test:data-integrity

      - name: Prove authoring build remains byte-stable
        run: |
          git add scripts/inventory.js tests/profile-restore-rehydration.test.mjs
          npm run build
          git diff --exit-code

      - name: Remove transformer and commit validated repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/site-quality-checks.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  # BEDROCK_ONE_TIME_PROFILE_RESTORE_START\n'
          if text.count(marker) != 1:
              raise SystemExit('One-time profile restore marker missing or duplicated')
          start = text.index(marker)
          path.write_text(text[:start].rstrip() + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/site-quality-checks.yml scripts/inventory.js tests/profile-restore-rehydration.test.mjs
          git diff --cached --check
          git commit -m "Make profile restore transactional after sign-in"
          git push origin HEAD:bedrock/production-finalization-v2
  # BEDROCK_ONE_TIME_PROFILE_RESTORE_END
