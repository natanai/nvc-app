name: Site Quality

on:
  pull_request:
    branches: [inventory-core-overhaul]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to check"
        required: true
        default: "inventory-core-overhaul"

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify generated output
        run: |
          npm run build
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The build changed tracked or untracked artifacts. Commit generated output before merging."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi
          npm run verify:build-idempotent

      - name: Verify architecture and workflow contracts
        run: npm run test:architecture

      - name: Verify content integrity
        run: npm run test:content-integrity

      - name: Verify UI regressions
        run: npm run test:ui-regressions
