name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

permissions:
  contents: write

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bedrock-regression-repair:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'bedrock/production-finalization-v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for pending one-shot repair
        id: pending
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect repair script
        id: detect
        shell: bash
        run: |
          if [ -f .github/scripts/bedrock-regression-repair.py ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.pending == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.pending == 'true'
        run: npm ci

      - name: Apply root-cause repair
        if: steps.detect.outputs.pending == 'true'
        run: python3 .github/scripts/bedrock-regression-repair.py

      - name: Regenerate canonical pages
        if: steps.detect.outputs.pending == 'true'
        run: npm run build:pages

      - name: Prove second page build is byte-stable
        if: steps.detect.outputs.pending == 'true'
        run: |
          git diff > /tmp/first.diff
          npm run build:pages
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff

      - name: Validate repaired paint/runtime ownership
        if: steps.detect.outputs.pending == 'true'
        run: |
          node --test tests/magnet-prepaint.test.mjs
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          node --test tests/runtime-load-graph.test.mjs
          node --test tests/route-runtime-ownership.test.mjs
          npm run lint:entrypoints

      - name: Remove repair scaffolding and publish clean checkpoint
        if: steps.detect.outputs.pending == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/bedrock-run-regression-repair.yml
          rm -f .github/workflows/bedrock-remove-canonicalization-regressions.yml
          rm -f .github/scripts/bedrock-regression-repair.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/site-quality-checks.yml')
          text = path.read_text()
          start = text.index('permissions:\n  contents: write\n\n')
          jobs = text.index('jobs:\n', start)
          site = text.index('  site-quality:\n', jobs)
          prefix = text[:start]
          suffix = text[site:]
          path.write_text(prefix + 'jobs:\n' + suffix)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove Bedrock canonicalization paint regressions"
          git push origin HEAD:"${HEAD_REF}"

  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validate the exact committed static site first. The authoring build below
      # is intentionally allowed to mutate the checkout so its reproducibility
      # can be checked independently without contaminating runtime regressions.
      - name: Verify data integrity
        id: data-integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Verify static layout contracts
        id: static-layout-contracts
        if: always()
        run: |
          node --test tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs

      - name: Verify page generator ownership
        id: generator-ownership
        if: always()
        run: npm run test:generator-ownership

      - name: Verify first-load performance budgets
        id: performance-budgets
        if: always()
        run: npm run test:performance

      - name: Verify fact-checking authoring round-trip
        id: fact-checking-roundtrip
        if: always()
        shell: bash
        run: |
          node scripts/fact-checking-manifest.mjs check
          npm run export:fact-checking

          if ! git diff --quiet -- fact-checking; then
            echo "::error title=Fact-checking bundle is stale::A fresh export changed checked-in fact-checking files."
            git diff --name-only -- fact-checking
            git diff --stat -- fact-checking
            exit 1
          fi

          npm run import:fact-checking
          source_paths=(
            data/Needs.csv
            data/Feelings.csv
            'data/Faux Feelings.csv'
            data/Strategies.csv
            data/color-palettes.csv
            data/reverse-inference-overrides.json
            data/observation_taxonomy.json
            data/observation_lexicon.json
            data/observation_need_templates.json
            data/observation_module_blueprints.json
            data/observation_detector_stats.json
            data/observation-guide.json
            _evidence/citations.csv
          )
          if ! git diff --quiet -- "${source_paths[@]}"; then
            echo "::error title=Fact-checking import is lossy::A fresh export/import cycle changed canonical source files."
            git diff --name-only -- "${source_paths[@]}"
            git diff --stat -- "${source_paths[@]}"
            exit 1
          fi

          # Export was already proven byte-identical; restore it explicitly so
          # the later full-build reproducibility check starts from a clean tree.
          git checkout -- fact-checking

      - name: Build site
        id: build-site
        if: always()
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the committed/live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Summarize site quality
        if: always()
        run: |
          echo "Committed data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Committed customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Committed flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Committed navigation magnets: ${{ steps.navigation-magnets.outcome }}"
          echo "Committed static layout contracts: ${{ steps.static-layout-contracts.outcome }}"
          echo "Page generator ownership: ${{ steps.generator-ownership.outcome }}"
          echo "First-load performance budgets: ${{ steps.performance-budgets.outcome }}"
          echo "Fact-checking round-trip: ${{ steps.fact-checking-roundtrip.outcome }}"
          echo "Authoring build: ${{ steps.build-site.outcome }}"
          echo "Build reproducibility: ${{ steps.generated-artifacts.outcome }}"

          if [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ] \
            && [ "${{ steps.static-layout-contracts.outcome }}" = "success" ] \
            && [ "${{ steps.generator-ownership.outcome }}" = "success" ] \
            && [ "${{ steps.performance-budgets.outcome }}" = "success" ] \
            && [ "${{ steps.fact-checking-roundtrip.outcome }}" = "success" ]; then
            echo "Committed static-site runtime, generator ownership, performance-budget, and fact-checking round-trip checks passed."
          else
            echo "One or more committed-site/authoring checks failed; inspect those before publishing this branch."
          fi

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ]; then
            echo "Authoring pipeline is reproducible."
          else
            echo "Authoring pipeline has reproducibility debt; see the build/artifact check above."
          fi
