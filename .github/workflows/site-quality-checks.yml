name: Site Quality Checks

on:
  push:
    branches: [inventory-core-overhaul]
  pull_request:
    branches: [inventory-core-overhaul]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run checks against'
        required: true
        default: inventory-core-overhaul

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}

      - name: Checkout event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validate the exact committed static site first. The authoring build below
      # is intentionally allowed to mutate the checkout so its reproducibility
      # can be checked independently without contaminating runtime regressions.
      - name: Verify data integrity
        id: data-integrity
        run: npm run test:data-integrity

      - name: Verify customizer preload
        id: customizer-preload
        if: always()
        run: npm run test:customizer

      - name: Run flicker and jitter checker
        id: flicker-jitter
        if: always()
        run: npm run test:flicker-jitter

      - name: Verify navigation magnets
        id: navigation-magnets
        if: always()
        run: npm run test:nav-magnets

      - name: Verify static layout contracts
        id: static-layout-contracts
        if: always()
        run: |
          node --test tests/shared-density-polish.test.mjs
          node tests/body-cues-static-first.test.mjs

      - name: Verify page generator ownership
        id: generator-ownership
        if: always()
        run: npm run test:generator-ownership

      - name: Verify fact-checking authoring round-trip
        id: fact-checking-roundtrip
        if: always()
        shell: bash
        run: |
          node scripts/fact-checking-manifest.mjs check
          npm run export:fact-checking

          if ! git diff --quiet -- fact-checking; then
            echo "::error title=Fact-checking bundle is stale::A fresh export changed checked-in fact-checking files."
            git diff --name-only -- fact-checking
            git diff --stat -- fact-checking
            exit 1
          fi

          npm run import:fact-checking
          source_paths=(
            data/Needs.csv
            data/Feelings.csv
            'data/Faux Feelings.csv'
            data/Strategies.csv
            data/color-palettes.csv
            data/reverse-inference-overrides.json
            data/observation_taxonomy.json
            data/observation_lexicon.json
            data/observation_need_templates.json
            data/observation_module_blueprints.json
            data/observation_detector_stats.json
            data/observation-guide.json
            _evidence/citations.csv
          )
          if ! git diff --quiet -- "${source_paths[@]}"; then
            echo "::error title=Fact-checking import is lossy::A fresh export/import cycle changed canonical source files."
            git diff --name-only -- "${source_paths[@]}"
            git diff --stat -- "${source_paths[@]}"
            exit 1
          fi

          git checkout -- fact-checking

      - name: Build site
        id: build-site
        if: always()
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: "1"

      - name: Verify generated artifacts are committed
        id: generated-artifacts
        if: ${{ always() && steps.build-site.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are up to date."
            exit 0
          fi

          echo "::error title=Generated artifacts are out of date::npm run build changed committed files. This is a repository reproducibility issue and does not by itself mean the committed/live site is broken."
          echo "Changed files after build:"
          git diff --name-only
          echo
          echo "Diff summary:"
          git diff --stat
          echo
          echo "Representative diff (first 300 lines):"
          git diff --unified=3 | sed -n '1,300p'
          exit 1

      - name: Summarize site quality
        if: always()
        run: |
          echo "Committed data integrity: ${{ steps.data-integrity.outcome }}"
          echo "Committed customizer preload: ${{ steps.customizer-preload.outcome }}"
          echo "Committed flicker/jitter: ${{ steps.flicker-jitter.outcome }}"
          echo "Committed navigation magnets: ${{ steps.navigation-magnets.outcome }}"
          echo "Committed static layout contracts: ${{ steps.static-layout-contracts.outcome }}"
          echo "Page generator ownership: ${{ steps.generator-ownership.outcome }}"
          echo "Fact-checking round-trip: ${{ steps.fact-checking-roundtrip.outcome }}"
          echo "Authoring build: ${{ steps.build-site.outcome }}"
          echo "Build reproducibility: ${{ steps.generated-artifacts.outcome }}"

          if [ "${{ steps.data-integrity.outcome }}" = "success" ] \
            && [ "${{ steps.customizer-preload.outcome }}" = "success" ] \
            && [ "${{ steps.flicker-jitter.outcome }}" = "success" ] \
            && [ "${{ steps.navigation-magnets.outcome }}" = "success" ] \
            && [ "${{ steps.static-layout-contracts.outcome }}" = "success" ] \
            && [ "${{ steps.generator-ownership.outcome }}" = "success" ] \
            && [ "${{ steps.fact-checking-roundtrip.outcome }}" = "success" ]; then
            echo "Committed static-site runtime, generator ownership, and fact-checking round-trip checks passed."
          else
            echo "One or more committed-site/authoring checks failed; inspect those before publishing this branch."
          fi

          if [ "${{ steps.build-site.outcome }}" = "success" ] \
            && [ "${{ steps.generated-artifacts.outcome }}" = "success" ]; then
            echo "Authoring pipeline is reproducible."
          else
            echo "Authoring pipeline has reproducibility debt; see the build/artifact check above."
          fi

  extract-strategy-deck:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'bedrock/production-finalization-v2'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 1

      - name: Prove extracted runtime matches old Inventory tail exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          inventory_path = Path('scripts/inventory.js')
          deck_path = Path('scripts/strategy-deck.js')
          source = inventory_path.read_text()
          marker = "\n(function () {\n  const stack = document.querySelector('[data-strategy-stack]');"
          start = source.rfind(marker)
          if start < 0:
              raise SystemExit('Could not find the self-contained strategy-deck IIFE at inventory.js tail.')
          original = source[start + 1:]
          expected = original.replace('(function () {', '(function initStrategyDeck() {', 1)
          actual = deck_path.read_text()
          if actual != expected:
              import difflib
              print(''.join(difflib.unified_diff(
                  expected.splitlines(True), actual.splitlines(True),
                  fromfile='expected-from-inventory.js', tofile='scripts/strategy-deck.js', n=3,
              ))[:12000])
              raise SystemExit('strategy-deck.js is not an exact extraction of the existing IIFE.')
          inventory_path.write_text(source[:start].rstrip() + '\n')
          PY
          node --check scripts/inventory.js
          node --check scripts/strategy-deck.js

      - name: Give Need pages the route-specific deck owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-pages.mjs')
          source = path.read_text()
          old = """        scripts: [
      { src: 'scripts/inventory-bluesky.js?v=2026-02-12', module: true },
    ],"""
          new = """        scripts: [
      { src: 'scripts/strategy-deck.js', defer: true },
      { src: 'scripts/inventory-bluesky.js?v=2026-02-12', module: true },
    ],"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one Need-page scripts block; found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check scripts/build-pages.mjs
          node scripts/build-pages.mjs --scope needs
          git diff --check

      - name: Reject collateral output and validate ownership
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const data = JSON.parse(fs.readFileSync('data/index.json', 'utf8'));
          const needPages = new Set((data.needs || []).map(item => `needs/${item.slug}/index.html`));
          const allowed = new Set(['scripts/inventory.js', 'scripts/build-pages.mjs', ...needPages]);
          const changed = cp.execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split(/\r?\n/).filter(Boolean);
          const unexpected = changed.filter(path => !allowed.has(path));
          if (unexpected.length) {
            console.error(`Unexpected paths:\n${unexpected.join('\n')}`);
            process.exit(1);
          }
          for (const page of needPages) {
            const html = fs.readFileSync(page, 'utf8');
            if (!html.includes('scripts/strategy-deck.js')) {
              console.error(`${page} is missing strategy-deck.js`);
              process.exit(1);
            }
          }
          if (fs.readFileSync('scripts/inventory.js', 'utf8').includes("const stack = document.querySelector('[data-strategy-stack]');")) {
            throw new Error('inventory.js still owns the strategy deck.');
          }
          console.log(`Verified route-specific strategy-deck ownership on ${needPages.size} Need pages.`);
          NODE

      - name: Run focused regressions
        run: |
          npm run test:flicker-jitter
          npm run test:generator-ownership
          npm run test:data-integrity

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/inventory.js scripts/build-pages.mjs needs
          git commit -m "Extract Need strategy deck from Inventory controller"
          git push origin HEAD:bedrock/production-finalization-v2
