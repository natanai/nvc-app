name: One-time stability migration

on:
  pull_request:
    branches:
      - inventory-core-overhaul

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'stability-generated-source-of-truth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: stability-generated-source-of-truth
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration without changing workflows
        id: migrate
        run: |
          if [ ! -f scripts/finalize-static-assets.mjs ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Source migration already applied."
            exit 0
          fi

          node scripts/_apply-stability-migration.mjs
          git restore --source=HEAD -- .github/workflows
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Commit migrated source
        if: steps.migrate.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make generator the static UI source of truth"
          git push origin HEAD:stability-generated-source-of-truth

# Branch-local validation harness; remove before merge.
