name: Bedrock Journal width runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Journal inline-size repair
        run: node scripts/.bedrock-journal-width-fix.mjs

      - name: Regenerate canonical Journal output
        run: node scripts/build-pages.mjs --scope inventory

      - name: Check focused contracts
        run: |
          git diff --check
          node --test tests/final-hierarchy-ux.test.mjs tests/journal-initial-history-hydration.test.mjs

      - name: Run Bedrock regressions
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:generator-ownership
          npm run test:performance
          npm run test:delivery

      - name: Verify canonical authoring build
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Remove one-shot migration scaffolding
        run: |
          rm -f scripts/.bedrock-journal-width-fix.mjs
          rm -f .github/workflows/bedrock-journal-width-runner.yml
          rm -f scripts/.bedrock-journal-width-trigger

      - name: Verify obsolete architecture stays gone
        run: npm run test:obsolete

      - name: Commit tested Bedrock result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Contain populated Journal width on mobile'

      - name: Prove final head is deterministic
        run: |
          npm run build
          git diff --exit-code
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Push tested Bedrock head
        run: git push origin HEAD:bedrock/production-finalization-v2
