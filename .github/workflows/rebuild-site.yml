name: Rebuild Site from Spreadsheets

on:
  push:
    branches:
      - remove-runtime-ui-polish

permissions:
  contents: write

jobs:
  finalize-static-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: remove-runtime-ui-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Finalize checked-in static assets
        run: node scripts/finalize-static-assets.mjs

      - name: Commit finalized static assets
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize static UI from source"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Push finalized assets
        if: steps.commit.outputs.changes == 'true'
        run: git push origin HEAD:remove-runtime-ui-polish
