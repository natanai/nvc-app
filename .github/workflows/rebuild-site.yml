name: Rebuild Site from Spreadsheets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to rebuild (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      commit_message:
        description: "Commit message for the rebuilt site"
        required: false
        default: "Rebuild site from spreadsheets"

permissions:
  contents: write

concurrency:
  group: nvc-app-write-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  rebuild-site:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dataset and pages
        run: |
          npm run build:data
          npm run build:pages

      - name: Verify rebuild stability and scope
        run: |
          npm run verify:build-idempotent
          npm run guard:workflow-output -- site-rebuild
          npm run test:generator-stability
          npm run test:data-integrity

      - name: Commit rebuilt site
        id: commit
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected after rebuilding the site."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/body-regions.json data/reverse-inference.json \
            index.html alexithymia-support faux-feelings feelings needs inventory observations
          git commit -m "$COMMIT_MESSAGE"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Push updates
        if: steps.commit.outputs.changes == 'true'
        run: git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Summarize run
        run: |
          if [ "${{ steps.commit.outputs.changes }}" = "true" ]; then
            SUMMARY="Rebuilt dataset and pages and pushed validated updates to ${{ env.TARGET_BRANCH }}."
          else
            SUMMARY="No updates were detected after rebuilding the site."
          fi
          {
            echo "## Rebuild Site"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
