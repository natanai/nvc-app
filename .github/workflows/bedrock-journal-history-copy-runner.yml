name: Bedrock Journal history/copy finalizer

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Journal history/copy finalization
        shell: bash
        run: |
          if [ ! -f .github/scripts/bedrock-journal-history-copy-finalize.mjs ]; then
            echo "No Journal history/copy finalizer present; nothing to do."
            exit 0
          fi
          node .github/scripts/bedrock-journal-history-copy-finalize.mjs
          rm .github/scripts/bedrock-journal-history-copy-finalize.mjs
          node --check scripts/inventory.js
          node --check assets/js/journal/module.js
          npm ci --ignore-scripts
          npm run build
          npm run test:flicker-jitter
          npm run test:generator-ownership
          npm run test:obsolete
      - name: Commit finalized Bedrock changes when present
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No Journal history/copy changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Journal long-entry history and reflection copy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
