name: Bedrock fix Journal script order

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  fix-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add explicit before-base script ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-pages.mjs')
          text = path.read_text(encoding='utf-8')

          old_entries = "  const entries = [...baseScripts, ...scripts];"
          new_entries = "  const beforeBaseScripts = scripts.filter((entry) => entry && typeof entry === 'object' && entry.beforeBase === true);\n  const regularScripts = scripts.filter((entry) => !(entry && typeof entry === 'object' && entry.beforeBase === true));\n  const entries = [...beforeBaseScripts, ...baseScripts, ...regularScripts];"
          if text.count(old_entries) != 1:
              raise SystemExit(f'Expected one normalizeScripts entries line, found {text.count(old_entries)}')
          text = text.replace(old_entries, new_entries)

          old_store = "{ src: 'assets/js/journal/store.js', type: 'module' },"
          new_store = "{ src: 'assets/js/journal/store.js', type: 'module', beforeBase: true },"
          if text.count(old_store) != 1:
              raise SystemExit(f'Expected one dedicated Journal store entry, found {text.count(old_store)}')
          text = text.replace(old_store, new_store)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove authoring build is byte-stable
        run: |
          npm run build
          changed="$(git diff --name-only)"
          if [ "$changed" != "scripts/build-pages.mjs" ]; then
            echo "Unexpected build changes:"
            printf '%s\n' "$changed"
            git diff --stat
            exit 1
          fi
          git diff --check

      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-fix-journal-script-order.yml
          git add scripts/build-pages.mjs
          git commit -m "Keep dedicated Journal scripts in stable order"
          git push origin HEAD:bedrock/production-finalization-v2
