name: Repair body-cue source (temporary)

on:
  push:
    branches: [repair-generated-source-of-truth]
    paths:
      - '.github/workflows/repair-body-cue-source.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preserve live body-cue weights and remove duplicates
        run: node scripts/repair-body-cue-source.mjs

      - name: Verify duplicate mappings are gone
        run: node scripts/validate-body-cue-source.mjs

      - name: Commit repaired source and remove migration helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Feelings.csv
          git rm .github/workflows/repair-body-cue-source.yml scripts/repair-body-cue-source.mjs
          git commit -m "Deduplicate body-cue source without changing live weights"
          git push
