name: One-time Observations live refinement

on:
  push:
    branches:
      - performance/immediate-response-v1

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Run observations live refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical Observations refinement
        run: node .github/scripts/observations-live-refine.mjs
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Observations through its compiler owner
        run: node scripts/build-pages.mjs --scope=observation-guide
      - name: Rebuild canonical generated site
        run: npm run build
      - name: Verify behavior, ownership, and delivery contracts
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          npm run test:delivery
          npm run test:generator-ownership
          npm run test:obsolete
      - name: Reject collateral changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              styles/observations-critical.css|styles/observations-mobile.css|assets/js/observation-editor.js|tests/shared-density-polish.test.mjs|docs/observations-mobile-layout.md|observations/index.html|.github/scripts/observations-live-refine.mjs|.github/workflows/observations-live-refine.yml)
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$bad"
      - name: Remove one-time migration scaffolding
        run: |
          rm .github/scripts/observations-live-refine.mjs
          rm .github/workflows/observations-live-refine.yml
      - name: Commit refined canary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Observations mobile results and overlay"
          git push origin HEAD:performance/immediate-response-v1
