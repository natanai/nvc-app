name: Bedrock refresh fact-checking bundle

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

jobs:
  refresh-fact-checking:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh bundle and prove override round-trip
        shell: bash
        run: |
          cp data/reverse-inference-overrides.json /tmp/reverse-inference-overrides-before.json

          npm run export:fact-checking
          node scripts/fact-checking-manifest.mjs write
          node scripts/fact-checking-manifest.mjs check

          npm run import:fact-checking
          if ! cmp -s /tmp/reverse-inference-overrides-before.json data/reverse-inference-overrides.json; then
            echo "reverse-inference-overrides.csv did not round-trip to identical canonical JSON."
            diff -u /tmp/reverse-inference-overrides-before.json data/reverse-inference-overrides.json | sed -n '1,240p'
            exit 1
          fi

          npm run build:data
          npm run test:data-integrity

          unexpected="$(git diff --name-only | grep -v '^fact-checking/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Fact-checking refresh/round-trip changed files outside fact-checking/:"
            printf '%s\n' "$unexpected"
            git diff --stat
            exit 1
          fi

          git diff --check

      - name: Commit refreshed fact-checking bundle
        shell: bash
        run: |
          if git diff --quiet -- fact-checking; then
            echo "Fact-checking bundle is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- fact-checking
          git commit -m "Refresh canonical fact-checking bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
