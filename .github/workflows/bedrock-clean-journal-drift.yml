name: Bedrock clean Journal generation drift

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  clean-drift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLEAN_BASE: 8a78cd05591eddb5bff29011ffe059636d368993
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Restore touched HTML before removing only Journal store
        run: |
          mapfile -t html_files < <(git diff --name-only "$CLEAN_BASE"..HEAD -- '*.html')
          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "No HTML files found to clean."
            exit 1
          fi

          printf '%s\n' "${html_files[@]}" > /tmp/journal-html-files.txt
          for file in "${html_files[@]}"; do
            git checkout "$CLEAN_BASE" -- "$file"
          done

          python - <<'PY'
          from pathlib import Path
          import re

          files = [line.strip() for line in Path('/tmp/journal-html-files.txt').read_text().splitlines() if line.strip()]
          keep_eager = {'inventory/journal/index.html'}
          removed = []
          missing = []
          pattern = re.compile(r'^\s*<script src="(?:\.\./)*assets/js/journal/store\.js" type="module"></script>\s*\n', re.MULTILINE)

          for name in files:
              path = Path(name)
              if name in keep_eager:
                  continue
              text = path.read_text(encoding='utf-8')
              next_text, count = pattern.subn('', text, count=1)
              if count == 1:
                  path.write_text(next_text, encoding='utf-8')
                  removed.append(name)
              else:
                  missing.append(name)

          if missing:
              raise SystemExit('Expected one Journal store script in each ordinary touched page; missing in: ' + ', '.join(missing))
          if not removed:
              raise SystemExit('No ordinary Journal store scripts were removed')

          print(f'Removed only the Journal store script from {len(removed)} ordinary pages.')
          PY

      - name: Verify cleanup shape
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_sources = {'scripts/inventory.js', 'scripts/build-pages.mjs'}
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          unexpected = [p for p in changed if not (p.endswith('.html') or p in allowed_sources)]
          if unexpected:
              raise SystemExit('Unexpected cleanup paths: ' + ', '.join(unexpected))
          PY
          git diff --check

          # Dedicated Journal must keep its eager store/module pair.
          grep -q 'assets/js/journal/store.js' inventory/journal/index.html
          grep -q 'assets/js/journal/module.js' inventory/journal/index.html

          # Ordinary fixtures and Feed must no longer parser-load the store.
          ! grep -q 'assets/js/journal/store.js' needs/acceptance/index.html
          ! grep -q 'assets/js/journal/store.js' feed/index.html

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-clean-journal-drift.yml
          while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done < <(git diff --name-only)
          git commit -m "Keep lazy Journal change free of generator drift"
          git push origin HEAD:bedrock/production-finalization-v2
