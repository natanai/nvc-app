name: Immediate response v1 migration

on:
  push:
    branches:
      - performance/immediate-response-v1

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run immediate response migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical route-runtime migration
        run: node .github/scripts/immediate-performance-v1.mjs
      - name: Install dependencies
        run: npm ci
      - name: Rebuild through canonical owners
        run: npm run build
      - name: Verify behavior and ownership contracts
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          npm run test:delivery
          npm run test:generator-ownership
          npm run test:obsolete
      - name: Reject collateral changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              scripts/build-pages.mjs|tests/route-runtime-ownership.test.mjs|\
              feelings/index.html|feelings/body-cues/index.html|feelings/*/index.html|\
              faux-feelings/index.html|faux-feelings/*/index.html|needs/index.html|\
              .github/scripts/immediate-performance-v1.mjs|.github/workflows/immediate-performance-v1-runner.yml)
                if [[ "$path" == "feelings/emotions-wheel/index.html" ]]; then
                  echo "Unexpected standalone Emotions Wheel rewrite: $path" >&2
                  bad=1
                fi
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$bad"
      - name: Remove temporary migration scaffolding
        run: |
          rm .github/scripts/immediate-performance-v1.mjs
          rm .github/workflows/immediate-performance-v1-runner.yml
      - name: Verify final diff
        run: git diff --check
      - name: Commit performance canary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand intent-loaded runtime canary"
          git push origin HEAD:performance/immediate-response-v1

# Triggered after the workflow file was present on the branch.
