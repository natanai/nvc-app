name: Bedrock clean Body Cue source

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

jobs:
  clean-body-cue-source:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Clean audited duplicate and alias rows
        shell: bash
        run: |
          cp data/body-regions.json /tmp/body-regions-before.json
          cp data/index.json /tmp/index-before.json

          python - <<'PY'
          from pathlib import Path

          path = Path('data/Feelings.csv')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          removals = {
              49: ('chest-pounding', ',excited,1'),
              56: ('gut-rolling', ',anxiety,1'),
              57: ('gut-rolling', ',excited,0.9'),
              100: ('head-buzzing', ',excited,0.9'),
              124: ('limbs-restless', ',excited,1'),
              127: ('limbs-tingly', ',excited,1.1'),
              140: ('temp-prickly', ',excited,0.9'),
          }

          for line_no, needles in removals.items():
              if line_no > len(lines):
                  raise SystemExit(f'Expected source line {line_no}, file has only {len(lines)} physical lines.')
              line = lines[line_no - 1]
              if not all(needle in line for needle in needles):
                  raise SystemExit(f'Line {line_no} no longer matches audited duplicate: {line.rstrip()}')

          alias_line_no = 159
          alias_line = lines[alias_line_no - 1]
          if 'chest-open' not in alias_line or ',love,1.1' not in alias_line:
              raise SystemExit(f'Line {alias_line_no} no longer matches audited love alias: {alias_line.rstrip()}')
          lines[alias_line_no - 1] = alias_line.replace(',love,1.1', ',love-caring,1.1', 1)

          for line_no in sorted(removals, reverse=True):
              del lines[line_no - 1]

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          git diff --check

      - name: Prove cleaned source preserves production Body Cues semantics
        shell: bash
        run: |
          node scripts/build-data.mjs

          node - <<'NODE'
          const fs = require('node:fs');
          const { isDeepStrictEqual } = require('node:util');
          const beforeIndex = JSON.parse(fs.readFileSync('/tmp/index-before.json', 'utf8'));
          const afterIndex = JSON.parse(fs.readFileSync('data/index.json', 'utf8'));
          if (!isDeepStrictEqual(beforeIndex, afterIndex)) {
            throw new Error('Cue-source cleanup changed data/index.json semantics.');
          }
          NODE

          node scripts/finalize-generated-data.mjs

          node - <<'NODE'
          const fs = require('node:fs');
          const { isDeepStrictEqual } = require('node:util');
          const before = JSON.parse(fs.readFileSync('/tmp/body-regions-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('data/body-regions.json', 'utf8'));
          if (!isDeepStrictEqual(before, after)) {
            throw new Error('Cleaned Feelings.csv does not preserve production Body Cues semantics.');
          }
          NODE

          node tests/data-integrity.test.mjs
          git checkout -- data/index.json data/body-regions.json data/reverse-inference.json

          changed="$(git diff --name-only)"
          if [ "$changed" != "data/Feelings.csv" ]; then
            echo "Unexpected changed paths after validation:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit canonical Body Cue source cleanup
        shell: bash
        run: |
          if git diff --quiet -- data/Feelings.csv; then
            echo "Body Cue source is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/Feelings.csv
          git commit -m "Canonicalize Body Cue source rows"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
