name: Bedrock strategy deck extraction

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

concurrency:
  group: bedrock-strategy-deck-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  extract-strategy-deck:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock test branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract route-owned strategy deck
        shell: bash
        run: |
          git show HEAD:scripts/inventory.js > /tmp/inventory-before.js
          node --check scripts/bedrock-migrate-strategy-deck.mjs
          node scripts/bedrock-migrate-strategy-deck.mjs
          node --check scripts/inventory.js
          node --check scripts/strategy-deck.js
          node --check scripts/build-pages.mjs
          npm run build:pages -- --scope needs
          git diff --check

      - name: Prove extracted runtime is the previous controller tail
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const original = readFileSync('/tmp/inventory-before.js', 'utf8');
          const marker = "\n(function () {\n  const stack = document.querySelector('[data-strategy-stack]');";
          const start = original.indexOf(marker);
          if (start < 0) throw new Error('Original deck boundary missing.');
          const expected = original.slice(start + 1).trimEnd() + '\n';
          const actual = readFileSync('scripts/strategy-deck.js', 'utf8');
          if (actual !== expected) throw new Error('strategy-deck.js is not byte-identical to the previous Inventory tail.');
          NODE

      - name: Verify extraction ownership
        shell: bash
        run: |
          changed="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/inventory\.js|scripts/strategy-deck\.js|scripts/build-pages\.mjs|needs/[^/]+/index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths changed by strategy deck extraction:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          for required in scripts/inventory.js scripts/strategy-deck.js scripts/build-pages.mjs; do
            if ! printf '%s\n' "$changed" | grep -qx "$required"; then
              echo "Expected extraction output missing: $required"
              exit 1
            fi
          done
          if ! printf '%s\n' "$changed" | grep -Eq '^needs/[^/]+/index\.html$'; then
            echo "No generated Need detail pages changed to reference strategy-deck.js."
            exit 1
          fi

      - name: Verify strategy deck and route contracts
        run: |
          node --test tests/strategy-deck-ownership.test.mjs tests/route-runtime-ownership.test.mjs
          npm run test:flicker-jitter
          npm run test:generator-ownership
          npm run test:performance

      - name: Prove canonical Need generation is immediately stable
        shell: bash
        run: |
          before="$(git diff)"
          npm run build:pages -- --scope needs
          after="$(git diff)"
          if [ "$before" != "$after" ]; then
            echo "Second scoped Need build changed strategy-deck extraction output."
            git diff --stat
            exit 1
          fi

      - name: Commit strategy deck extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/inventory.js scripts/strategy-deck.js scripts/build-pages.mjs 'needs/*/index.html'
          git commit -m "Extract Need strategy deck runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
