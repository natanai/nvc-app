name: Apply Support Lane Wizard V1 Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-support-lane-wizard-v1.trigger'

permissions:
  contents: write

jobs:
  apply-support-lane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply one-step Support Lane integration
        run: node scripts/apply-support-lane-wizard-v1.mjs

      - name: Run focused checks
        run: |
          node --check scripts/alexithymia-support.js
          npm run lint:evidence
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('alexithymia-support/index.html', 'utf8');
          const js = fs.readFileSync('scripts/alexithymia-support.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          const steps = [...html.matchAll(/<article class="([^"]*support-step[^"]*)" data-step="([^"]+)"/g)];
          if (steps.length !== 9) throw new Error(`Expected 9 Support Lane steps, found ${steps.length}`);
          const initiallyVisible = steps.filter(([, classes]) => !classes.includes('is-hidden'));
          if (initiallyVisible.length !== 1 || initiallyVisible[0][2] !== 'intro') {
            throw new Error('Only intro should be visible before JavaScript starts');
          }
          if (html.includes('support-scroll-hint')) throw new Error('Scroll hints should be removed');
          if (!html.includes('Skip breathing')) throw new Error('Short breathing skip label missing');
          if ((html.match(/data-step-cta/g) || []).length !== 6) throw new Error('Manual step controls missing');
          if (js.includes('revealStep(')) throw new Error('Legacy revealStep behavior remains');
          if (!js.includes('showOnlyStep(key)')) throw new Error('One-step visibility helper missing');
          if (!css.includes('Support Lane wizard stability v1')) throw new Error('Scoped Support Lane stability CSS missing');
          console.log('Support Lane focused smoke checks passed.');
          NODE

      - name: Confirm only intended durable files changed
        run: |
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(alexithymia-support/index\.html|scripts/alexithymia-support\.js|styles\.css)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected site changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot integration machinery
        run: git rm .github/workflows/apply-support-lane-wizard-v1.yml scripts/apply-support-lane-wizard-v1.mjs

      - name: Commit durable Support Lane changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alexithymia-support/index.html scripts/alexithymia-support.js styles.css
          git commit -m "Restore guided Support Lane flow"
          git push origin HEAD:ux-audit
