name: Navigation Magnet Coverage

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  nav-magnet-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Verify data integrity
        run: npm run test:data-integrity

      - name: Verify navigation magnets
        run: npm run test:nav-magnets
