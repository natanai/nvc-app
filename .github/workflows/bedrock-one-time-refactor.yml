name: Bedrock one-time exact refactor

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  exact-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Apply exact source transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file_path.write_text(text.replace(old, new), encoding='utf-8')

          inventory_old = """document.addEventListener('DOMContentLoaded', () => {
            state.basePath = document.body?.dataset?.basePath || '';
            state.journalDraftPath = typeof window !== 'undefined' ? window.location.pathname : '';
            setupViewportHeightProperty();
            state.inventory = loadInventory();
            refreshSavedStrategyIndex();
            state.journalStore = resolveJournalStore();
            updateJournalEntriesFromStore();
            highlightNavigation();
            initCustomizer().catch((error) => {
              console.warn('Unable to set up the customizer', error);
            });
            updateInventoryCount();
            setupNeedPage();
            setupInventoryPage();
            attachDelegatedJournalOverlayTriggerListener();
            setupJournalSection();
            renderJournalViews();
            loadJournalReferenceData();
            setupScrollTopButton();
            updateBackendSyncButtons();
            updateVisibilityControls();
            updateProfileSaveButtonStates();
          });"""

          inventory_new = """let inventoryRuntimeInitialized = false;

          function initializeInventoryRuntime() {
            if (inventoryRuntimeInitialized) {
              return;
            }
            inventoryRuntimeInitialized = true;

            state.basePath = document.body?.dataset?.basePath || '';
            state.journalDraftPath = typeof window !== 'undefined' ? window.location.pathname : '';
            setupViewportHeightProperty();
            state.inventory = loadInventory();
            refreshSavedStrategyIndex();
            state.journalStore = resolveJournalStore();
            updateJournalEntriesFromStore();
            highlightNavigation();
            initCustomizer().catch((error) => {
              console.warn('Unable to set up the customizer', error);
            });
            updateInventoryCount();
            setupNeedPage();
            setupInventoryPage();
            attachDelegatedJournalOverlayTriggerListener();
            setupJournalSection();
            renderJournalViews();
            loadJournalReferenceData();
            setupScrollTopButton();
            updateBackendSyncButtons();
            updateVisibilityControls();
            updateProfileSaveButtonStates();
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeInventoryRuntime, { once: true });
          } else {
            initializeInventoryRuntime();
          }"""

          replace_once('scripts/inventory.js', inventory_old, inventory_new)

          replace_once(
              'styles.css',
              "@import url('styles/needs-magnet-icons.css');\n@import url('styles/inventory-core-shell.css');",
              "@import url('styles/needs-magnet-icons.css');\n@import url('styles/shared-density.css');\n@import url('styles/inventory-core-shell.css');",
          )

          replace_once(
              'styles/inventory-core-shell.css',
              "@import url('shared-density.css');\n\n",
              '',
          )
          PY

      - name: Verify exact diff scope
        run: |
          changed="$(git diff --name-only)"
          expected=$'scripts/inventory.js\nstyles.css\nstyles/inventory-core-shell.css'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check

      - name: Commit transformed sources and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-refactor.yml
          git add scripts/inventory.js styles.css styles/inventory-core-shell.css
          git commit -m "Make shared runtime late-load safe and flatten CSS discovery"
          git push origin HEAD:bedrock/production-finalization-v2
