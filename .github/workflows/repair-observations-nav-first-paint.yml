name: One-time Observations nav first-paint repair

on:
  push:
    branches:
      - performance/immediate-response-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v7
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0

      - name: Detect staged migration
        id: staged
        shell: bash
        run: |
          if [[ -f .github/scripts/repair-observations-nav-first-paint.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.staged.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate migration script
        if: steps.staged.outputs.run == 'true'
        run: node --check .github/scripts/repair-observations-nav-first-paint.mjs

      - name: Apply canonical ownership migration
        if: steps.staged.outputs.run == 'true'
        run: node .github/scripts/repair-observations-nav-first-paint.mjs

      - name: Install dependencies
        if: steps.staged.outputs.run == 'true'
        run: npm ci

      - name: Rebuild through canonical owners
        if: steps.staged.outputs.run == 'true'
        run: npm run build

      - name: Verify Bedrock state and first-paint contracts
        if: steps.staged.outputs.run == 'true'
        shell: bash
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          npm run test:delivery
          npm run test:generator-ownership

      - name: Reject collateral changes
        if: steps.staged.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              README.md|scripts/build-pages.mjs|scripts/observation-guide.mjs|scripts/nav-prepaint.mjs|observations/index.html|tests/bedrock-state-contract.test.mjs|tests/magnet-prepaint.test.mjs|.github/scripts/repair-observations-nav-first-paint.mjs|.github/workflows/repair-observations-nav-first-paint.yml)
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$bad"

      - name: Remove one-time scaffolding
        if: steps.staged.outputs.run == 'true'
        shell: bash
        run: |
          rm .github/scripts/repair-observations-nav-first-paint.mjs
          rm .github/workflows/repair-observations-nav-first-paint.yml

      - name: Verify retired architecture after cleanup
        if: steps.staged.outputs.run == 'true'
        run: npm run test:obsolete

      - name: Verify canonical build stays zero-diff
        if: steps.staged.outputs.run == 'true'
        shell: bash
        run: |
          npm run build
          git diff --exit-code -- README.md scripts/build-pages.mjs scripts/observation-guide.mjs scripts/nav-prepaint.mjs observations/index.html tests/bedrock-state-contract.test.mjs tests/magnet-prepaint.test.mjs

      - name: Commit repaired canary
        if: steps.staged.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Observations navigation first-paint ownership"
          git push origin HEAD:performance/immediate-response-v1

# Trigger after workflow installation; the workflow removes itself after a successful canonical migration.
