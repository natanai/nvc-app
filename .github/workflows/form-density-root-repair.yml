name: Form Density Root Repair

on:
  pull_request:
    branches: [inventory-core-overhaul]

jobs:
  repair:
    if: ${{ github.head_ref == 'bedrock/production-finalization-v2' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect pending repair
        id: detect
        shell: bash
        run: |
          if [ -f .github/scripts/form-density-root-repair.py ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.pending == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.pending == 'true'
        run: npm ci

      - name: Apply root-owned density repair
        if: steps.detect.outputs.pending == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/form-density-root-repair.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = 'generated strategy forms must still originate in the page compiler'
          matches = [index for index, line in enumerate(lines) if marker in line and 'assert.ok(pages.includes(' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one density ownership assertion, found {len(matches)}')
          lines[matches[0]] = "  assert.ok(pages.includes('strategy-card strategy-card--form'), 'generated strategy forms must still originate in the page compiler');"
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 .github/scripts/form-density-root-repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('  background: color-mix(in srgb, var(--mint) 82%, #fff 18%);\n', ''),
              ('  background: color-mix(in srgb, #ffffff 88%, var(--mint) 12%);\n', '  background: #fff;\n'),
              ('  color: color-mix(in srgb, var(--ink) 78%, var(--mint) 22%);\n', '  color: var(--ink-soft);\n'),
              ('  background: color-mix(in srgb, #ffffff 95%, var(--lavender) 5%);\n', '  background: #fff;\n'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'canonical density simplification anchor missing: {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text.rstrip() + '\n', encoding='utf-8')

          test_path = Path('tests/native-action-controls.test.mjs')
          test_path.write_text(test_path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Remove temporary repair script
        if: steps.detect.outputs.pending == 'true'
        run: rm -f .github/scripts/form-density-root-repair.py

      - name: Validate responsive UX and Bedrock contracts
        if: steps.detect.outputs.pending == 'true'
        run: |
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:obsolete
          npm run test:performance
          npm run lint:entrypoints
          npm run build
          git diff --check

      - name: Publish root-owned density repair
        if: steps.detect.outputs.pending == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/form-density-root-repair.yml'
          git diff --cached --check
          git commit -m "Tighten Journal and strategy form density"
          git push origin HEAD:"${HEAD_REF}"
