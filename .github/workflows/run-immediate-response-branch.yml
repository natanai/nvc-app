name: One-time immediate response branch runner

on:
  pull_request:
    branches:
      - inventory-core-overhaul
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'performance/immediate-response-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: gate
        name: Check whether migration is still staged
        shell: bash
        run: |
          if [[ -f .github/scripts/immediate-performance-v1.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical route-runtime migration
        if: steps.gate.outputs.run == 'true'
        run: node .github/scripts/immediate-performance-v1.mjs
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Rebuild through canonical owners
        if: steps.gate.outputs.run == 'true'
        run: npm run build
      - name: Verify behavior and ownership contracts
        if: steps.gate.outputs.run == 'true'
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          npm run test:delivery
          npm run test:generator-ownership
      - name: Reject collateral changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              scripts/build-pages.mjs|tests/route-runtime-ownership.test.mjs|tests/home-runtime-canary.test.mjs|\
              feelings/index.html|feelings/body-cues/index.html|feelings/*/index.html|\
              faux-feelings/index.html|faux-feelings/*/index.html|needs/index.html|\
              .github/scripts/immediate-performance-v1.mjs|.github/workflows/immediate-performance-v1-runner.yml)
                if [[ "$path" == "feelings/emotions-wheel/index.html" ]]; then
                  echo "Unexpected standalone Emotions Wheel rewrite: $path" >&2
                  bad=1
                fi
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$bad"
      - name: Remove target-branch migration scaffolding
        if: steps.gate.outputs.run == 'true'
        run: |
          rm .github/scripts/immediate-performance-v1.mjs
          rm .github/workflows/immediate-performance-v1-runner.yml
      - name: Verify retired architecture after scaffolding removal
        if: steps.gate.outputs.run == 'true'
        run: npm run test:obsolete
      - name: Commit performance canary
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand intent-loaded runtime canary"
          git push origin HEAD:performance/immediate-response-v1

  cleanup:
    needs: migrate
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inventory-core-overhaul
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-time runner if still present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/workflows/run-immediate-response-branch.yml ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-immediate-response-branch.yml
          git commit -m "Remove one-time immediate response branch runner"
          git push origin HEAD:inventory-core-overhaul
