name: Bedrock one-time Home runtime canary

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  home-canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Home intent loader and regression contract
        run: |
          cat > scripts/shell-runtime-loader.js <<'EOF'
          const INVENTORY_STORAGE_KEY = 'nvcApp.inventory';
          const INVENTORY_RUNTIME_WARM_SELECTOR = [
            '[data-shell-customizer-placeholder] .palette-corner__toggle',
            '[data-palette-toggle]',
            '[data-support-journal-open]',
            '[data-menu-drill="account-data"]',
            '[data-menu-action="share-with-nat"]',
            '#inventory-export',
            '#inventory-import-trigger',
            '[data-backend-save-button]',
            '[data-backend-load-button]',
          ].join(',');
          const INVENTORY_RUNTIME_REPLAY_SELECTOR = [
            '[data-shell-customizer-placeholder] .palette-corner__toggle',
            '[data-palette-toggle]',
            '[data-support-journal-open]',
            '[data-menu-action="share-with-nat"]',
            '#inventory-export',
            '#inventory-import-trigger',
            '[data-backend-save-button]',
            '[data-backend-load-button]',
          ].join(',');

          const loaderScript = document.currentScript;
          const inventoryRuntimeUrl = new URL(
            './inventory.js?v=2026-08-21-home-canary',
            loaderScript?.src || document.baseURI,
          ).href;

          let inventoryRuntimePromise = null;
          let inventoryRuntimeReady = typeof window.handleExportInventory === 'function';

          function readInventoryCount() {
            try {
              const raw = window.localStorage?.getItem(INVENTORY_STORAGE_KEY);
              if (!raw) return 0;
              const parsed = JSON.parse(raw);
              return Array.isArray(parsed) ? parsed.length : 0;
            } catch (error) {
              return 0;
            }
          }

          function syncInventoryCount() {
            const counter = document.querySelector('[data-inventory-count]');
            if (!(counter instanceof HTMLElement)) return;
            const total = readInventoryCount();
            if (!total) {
              counter.textContent = '';
              counter.hidden = true;
              return;
            }
            counter.textContent = String(total);
            counter.hidden = false;
          }

          function ensureInventoryClassicRuntime() {
            if (inventoryRuntimeReady || typeof window.handleExportInventory === 'function') {
              inventoryRuntimeReady = true;
              return Promise.resolve();
            }
            if (inventoryRuntimePromise) return inventoryRuntimePromise;

            inventoryRuntimePromise = new Promise((resolve, reject) => {
              const finish = () => {
                inventoryRuntimeReady = true;
                resolve();
              };
              const fail = () => {
                inventoryRuntimePromise = null;
                reject(new Error('Unable to load shared Inventory runtime'));
              };

              const existing = Array.from(document.scripts).find((script) => {
                if (!script.src) return false;
                try {
                  const url = new URL(script.src, window.location.href);
                  return /\/scripts\/inventory\.js$/i.test(url.pathname);
                } catch (error) {
                  return false;
                }
              });

              if (existing) {
                if (typeof window.handleExportInventory === 'function') {
                  finish();
                  return;
                }
                existing.addEventListener('load', finish, { once: true });
                existing.addEventListener('error', fail, { once: true });
                return;
              }

              const script = document.createElement('script');
              script.src = inventoryRuntimeUrl;
              script.async = true;
              script.dataset.shellInventoryRuntime = 'true';
              script.addEventListener('load', finish, { once: true });
              script.addEventListener('error', fail, { once: true });
              document.body.appendChild(script);
            });

            return inventoryRuntimePromise;
          }

          function closestRuntimeTrigger(target, selector) {
            return target instanceof Element ? target.closest(selector) : null;
          }

          function warmInventoryRuntime(event) {
            if (inventoryRuntimeReady) return;
            if (closestRuntimeTrigger(event.target, INVENTORY_RUNTIME_WARM_SELECTOR)) {
              ensureInventoryClassicRuntime().catch(() => {});
            }
          }

          function installInventoryRuntimeIntentLoader() {
            document.addEventListener('pointerover', warmInventoryRuntime, { capture: true, passive: true });
            document.addEventListener('pointerdown', warmInventoryRuntime, { capture: true, passive: true });
            document.addEventListener('focusin', warmInventoryRuntime, { capture: true });

            document.addEventListener('click', async (event) => {
              const target = event.target instanceof Element ? event.target : null;
              if (!target || inventoryRuntimeReady) return;

              const warmTrigger = target.closest(INVENTORY_RUNTIME_WARM_SELECTOR);
              if (!warmTrigger) return;

              const runtime = ensureInventoryClassicRuntime();
              const replayTrigger = target.closest(INVENTORY_RUNTIME_REPLAY_SELECTOR);
              if (!replayTrigger) {
                runtime.catch(() => {});
                return;
              }

              event.preventDefault();
              event.stopImmediatePropagation();
              try {
                await runtime;
                window.requestAnimationFrame(() => replayTrigger.click());
              } catch (error) {
                console.error('Unable to prepare shared allneeds controls', error);
              }
            }, true);
          }

          syncInventoryCount();
          installInventoryRuntimeIntentLoader();
          EOF

          cat > tests/home-runtime-canary.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { promises as fs } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const root = path.resolve(__dirname, '..');

          async function read(relativePath) {
            return fs.readFile(path.join(root, relativePath), 'utf8');
          }

          test('Home keeps first-paint shell state while leaving the shared Inventory controller off first load', async () => {
            const home = await read('index.html');
            const need = await read('needs/acceptance/index.html');
            const inventory = await read('inventory/index.html');

            assert.ok(home.includes('data-shell-customizer-placeholder'));
            assert.ok(home.includes('class="palette-corner__toggle"'));
            assert.ok(home.includes('<span class="palette-corner__glyph">+</span>'));
            assert.ok(home.includes('<span class="visually-hidden">Open customizer</span>'));
            assert.ok(home.includes('data-inventory-count hidden'));
            assert.ok(home.includes('<script src="scripts/shell-runtime-loader.js" defer></script>'));
            assert.ok(!home.includes('<script src="scripts/inventory.js" defer></script>'));
            assert.ok(
              home.indexOf('scripts/shell-runtime-loader.js') < home.indexOf('scripts/inventory-core-shell.js'),
              'Home intent loader should bind and restore the count before the Menu shell initializes',
            );

            assert.ok(need.includes('../../scripts/inventory.js'), 'Need pages remain eager during the Home canary');
            assert.ok(inventory.includes('../scripts/inventory.js'), 'Inventory workspace remains eager');
          });

          test('Home intent loader preserves the Inventory badge and replays runtime-owned actions', async () => {
            const loader = await read('scripts/shell-runtime-loader.js');

            assert.ok(loader.includes("const INVENTORY_STORAGE_KEY = 'nvcApp.inventory';"));
            assert.ok(loader.includes('return Array.isArray(parsed) ? parsed.length : 0;'));
            assert.ok(loader.includes("document.querySelector('[data-inventory-count]')"));
            assert.ok(loader.includes("'./inventory.js?v=2026-08-21-home-canary'"));
            assert.ok(loader.includes("'[data-shell-customizer-placeholder] .palette-corner__toggle'"));
            assert.ok(loader.includes("'[data-palette-toggle]'"));
            assert.ok(loader.includes("'[data-support-journal-open]'"));
            assert.ok(loader.includes("'[data-menu-drill=\"account-data\"]'"));
            assert.ok(loader.includes("'[data-menu-action=\"share-with-nat\"]'"));
            assert.ok(loader.includes("document.addEventListener('pointerdown', warmInventoryRuntime"));
            assert.ok(loader.includes('event.stopImmediatePropagation();'));
            assert.ok(loader.includes('window.requestAnimationFrame(() => replayTrigger.click());'));
            assert.ok(loader.includes("script.dataset.shellInventoryRuntime = 'true';"));
          });

          test('Customizer runtime adopts the static Home shell instead of replacing a visible desktop control', async () => {
            const controller = await read('scripts/inventory.js');

            assert.ok(controller.includes("document.querySelector('[data-shell-customizer-placeholder]')"));
            assert.ok(controller.includes("staticContainer?.querySelector('.palette-corner__toggle')"));
            assert.ok(controller.includes("container.removeAttribute('data-shell-customizer-placeholder');"));
            assert.ok(controller.includes('staticToggle instanceof HTMLButtonElement ? staticToggle : document.createElement'));
            assert.ok(controller.includes('if (!container.isConnected) {\n    document.body.appendChild(container);\n  }'));
          });

          test('generator models the Home canary explicitly rather than creating checked-in HTML exceptions', async () => {
            const generator = await read('scripts/build-pages.mjs');

            assert.ok(generator.includes('function normalizeScripts(scripts, options = {})'));
            assert.ok(generator.includes('const includeInventoryRuntime = options.includeInventoryRuntime !== false;'));
            assert.ok(generator.includes('...(includeInventoryRuntime ? [{ src: \'scripts/inventory.js\', defer: true }] : [])'));
            assert.ok(generator.includes("bodyExtras = '',"));
            assert.ok(generator.includes('includeInventoryRuntime = true,'));
            assert.ok(generator.includes('const extraBody = bodyExtras ? `${bodyExtras}\\n` : \'\';'));
            assert.ok(generator.includes("scripts: [{ src: 'scripts/shell-runtime-loader.js', defer: true, beforeBase: true }],"));
            assert.ok(generator.includes('bodyExtras: customizerShellPlaceholderHtml,'));
            assert.ok(generator.includes('includeInventoryRuntime: false,'));
          });
          EOF

      - name: Apply exact source-of-truth transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file_path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/build-pages.mjs',
              """const localStorageReminderHtml =
            '<p class=\"local-storage-note\">Reminder: This static site saves data in your browser; clearing local storage removes it, so export backups.</p>';

          function normalizeScripts(scripts) {
            const baseScripts = [
              { src: 'scripts/inventory-core-shell.js', defer: true },
              { src: 'scripts/inventory.js', defer: true },
              { src: 'scripts/magnets.js', module: true },
            ];""",
              """const localStorageReminderHtml =
            '<p class=\"local-storage-note\">Reminder: This static site saves data in your browser; clearing local storage removes it, so export backups.</p>';

          const customizerShellPlaceholderHtml = `    <div class=\"palette-corner\" data-shell-customizer-placeholder>
                <button type=\"button\" class=\"palette-corner__toggle\" aria-haspopup=\"dialog\" aria-expanded=\"false\">
                  <span class=\"palette-corner__glyph\">+</span>
                  <span class=\"visually-hidden\">Open customizer</span>
                </button>
              </div>`;

          function normalizeScripts(scripts, options = {}) {
            const includeInventoryRuntime = options.includeInventoryRuntime !== false;
            const baseScripts = [
              { src: 'scripts/inventory-core-shell.js', defer: true },
              ...(includeInventoryRuntime ? [{ src: 'scripts/inventory.js', defer: true }] : []),
              { src: 'scripts/magnets.js', module: true },
            ];""",
          )

          replace_once(
              'scripts/build-pages.mjs',
              """  socialAlt = 'Three colorful doorways symbolizing allneeds.app',
            headExtras = '',
          }) {""",
              """  socialAlt = 'Three colorful doorways symbolizing allneeds.app',
            headExtras = '',
            bodyExtras = '',
            includeInventoryRuntime = true,
          }) {""",
          )

          replace_once(
              'scripts/build-pages.mjs',
              '  const scriptEntries = normalizeScripts(scripts);',
              '  const scriptEntries = normalizeScripts(scripts, { includeInventoryRuntime });',
          )

          replace_once(
              'scripts/build-pages.mjs',
              """  const criticalStyles = navCriticalCss ? `    <style>${navCriticalCss}</style>` : '';
            const extraHead = headExtras ? `\\n${headExtras}` : '';

            return `<!DOCTYPE html>""",
              """  const criticalStyles = navCriticalCss ? `    <style>${navCriticalCss}</style>` : '';
            const extraHead = headExtras ? `\\n${headExtras}` : '';
            const extraBody = bodyExtras ? `${bodyExtras}\\n` : '';

            return `<!DOCTYPE html>""",
          )

          replace_once(
              'scripts/build-pages.mjs',
              """    </div>
          ${scriptsHtml ? `${scriptsHtml}\\n` : ''}  </body>""",
              """    </div>
          ${extraBody}${scriptsHtml ? `${scriptsHtml}\\n` : ''}  </body>""",
          )

          replace_once(
              'scripts/build-pages.mjs',
              """    main,
            activeNav: 'home',
            canonicalPath: '/',""",
              """    main,
            scripts: [{ src: 'scripts/shell-runtime-loader.js', defer: true, beforeBase: true }],
            activeNav: 'home',
            canonicalPath: '/',
            bodyExtras: customizerShellPlaceholderHtml,
            includeInventoryRuntime: false,""",
          )

          replace_once(
              'scripts/inventory.js',
              """function buildPaletteUi() {
            const container = document.createElement('div');
            container.className = 'palette-corner';

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'palette-corner__toggle';
            toggle.setAttribute('aria-haspopup', 'dialog');

            const glyph = document.createElement('span');
            glyph.className = 'palette-corner__glyph';
            glyph.textContent = '+';
            toggle.appendChild(glyph);

            const srLabel = document.createElement('span');
            srLabel.className = 'visually-hidden';
            srLabel.textContent = 'Open customizer';
            toggle.appendChild(srLabel);

            const nav = document.querySelector('.site-nav');""",
              """function buildPaletteUi() {
            const staticContainer = document.querySelector('[data-shell-customizer-placeholder]');
            const staticToggle = staticContainer?.querySelector('.palette-corner__toggle');
            const container =
              staticContainer instanceof HTMLElement ? staticContainer : document.createElement('div');
            container.className = 'palette-corner';
            container.removeAttribute('data-shell-customizer-placeholder');

            const toggle =
              staticToggle instanceof HTMLButtonElement ? staticToggle : document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'palette-corner__toggle';
            toggle.setAttribute('aria-haspopup', 'dialog');

            if (!(staticToggle instanceof HTMLButtonElement)) {
              const glyph = document.createElement('span');
              glyph.className = 'palette-corner__glyph';
              glyph.textContent = '+';
              toggle.appendChild(glyph);

              const srLabel = document.createElement('span');
              srLabel.className = 'visually-hidden';
              srLabel.textContent = 'Open customizer';
              toggle.appendChild(srLabel);
            }

            const nav = document.querySelector('.site-nav');""",
          )

          replace_once(
              'scripts/inventory.js',
              """  container.append(toggle, panel);
            document.body.appendChild(container);""",
              """  container.append(toggle, panel);
            if (!container.isConnected) {
              document.body.appendChild(container);
            }""",
          )

          replace_once(
              'package.json',
              '"test:flicker-jitter": "node --test tests/navigation-highlight.test.mjs tests/runtime-load-graph.test.mjs tests/shared-nav-menu.test.mjs tests/shared-density-polish.test.mjs tests/journal-load-graph.test.mjs"',
              '"test:flicker-jitter": "node --test tests/navigation-highlight.test.mjs tests/runtime-load-graph.test.mjs tests/shared-nav-menu.test.mjs tests/shared-density-polish.test.mjs tests/journal-load-graph.test.mjs tests/home-runtime-canary.test.mjs"',
          )
          PY

      - name: Regenerate declared page outputs
        run: npm run build:pages

      - name: Verify canary diff scope
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/bedrock-one-time-home-runtime-canary.yml',
              'index.html',
              'package.json',
              'scripts/build-pages.mjs',
              'scripts/inventory.js',
              'scripts/shell-runtime-loader.js',
              'tests/home-runtime-canary.test.mjs',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed if len(line) > 3}
          unexpected = sorted(paths - allowed)
          missing = sorted({'index.html', 'scripts/build-pages.mjs', 'scripts/inventory.js', 'scripts/shell-runtime-loader.js', 'tests/home-runtime-canary.test.mjs'} - paths)
          if unexpected:
              raise SystemExit('Unexpected changed paths: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('Expected canary changes missing: ' + ', '.join(missing))
          PY
          git diff --check

      - name: Run focused and protected regressions
        run: |
          node --check scripts/shell-runtime-loader.js
          node --test tests/home-runtime-canary.test.mjs
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:home-regressions
          npm run test:nav-magnets

      - name: Stage intended canary state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-home-runtime-canary.yml
          git add index.html package.json scripts/build-pages.mjs scripts/inventory.js scripts/shell-runtime-loader.js tests/home-runtime-canary.test.mjs
          git diff --cached --check

      - name: Prove full authoring build is reproducible
        run: |
          npm run build
          git diff --exit-code

      - name: Commit validated Home canary
        run: |
          git commit -m "Defer shared runtime on Home behind preserved shell"
          git push origin HEAD:bedrock/production-finalization-v2
