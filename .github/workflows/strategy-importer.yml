name: strategy-importer

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note about the incoming batch
        required: false
      base-branch:
        description: "Branch to apply strategy import to (defaults to repo default branch)"
        required: false

permissions:
  contents: write

jobs:
  import-strategies:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.inputs.base-branch || github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import personal strategies
        id: import
        run: |
          node strategy-importer/import-personal-strategies.mjs
          if git diff --quiet --exit-code data/Strategies.csv; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.import.outputs.changes == 'true'
        run: npm ci

      - name: Rebuild data and pages
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run build:data
          npm run build:pages

      - name: Commit and push import artifacts
        if: steps.import.outputs.changes == 'true'
        env:
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$NOTE" ]; then
            message="chore: import strategies - $NOTE"
          else
            message="chore: import strategies"
          fi

          git add -A
          git commit -m "$message"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Summary
        run: |
          if [ "${{ steps.import.outputs.changes }}" = "true" ]; then
            echo "Imported strategies and rebuilt site content on branch: ${{ env.TARGET_BRANCH }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new strategies were imported from strategy-importer/." >> "$GITHUB_STEP_SUMMARY"
          fi
