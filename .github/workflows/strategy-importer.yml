name: Strategy Importer

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      note:
        description: Optional note about the incoming batch
        required: false

permissions:
  contents: write

concurrency:
  group: nvc-app-write-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  import-strategies:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Import personal strategies
        id: import
        run: |
          node strategy-importer/import-personal-strategies.mjs
          if git diff --quiet --exit-code data/Strategies.csv; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.import.outputs.changes == 'true'
        run: npm ci

      - name: Rebuild data and pages
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run build:data
          npm run build:pages

      - name: Verify generated output stability and scope
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run verify:build-idempotent
          npm run guard:workflow-output -- strategy-import
          npm run test:generator-stability
          npm run test:data-integrity

      - name: Commit and push import artifacts
        if: steps.import.outputs.changes == 'true'
        env:
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$NOTE" ]; then
            message="chore: import strategies - $NOTE"
          else
            message="chore: import strategies"
          fi

          git add data/Strategies.csv data/index.json data/body-regions.json data/reverse-inference.json \
            index.html alexithymia-support faux-feelings feelings needs inventory observations
          git commit -m "$message"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Summary
        run: |
          if [ "${{ steps.import.outputs.changes }}" = "true" ]; then
            echo "Imported strategies, validated generated output, and rebuilt site content on branch: ${{ env.TARGET_BRANCH }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new strategies were imported from strategy-importer/." >> "$GITHUB_STEP_SUMMARY"
          fi
