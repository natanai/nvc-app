name: strategy-importer

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note about the incoming batch
        required: false

permissions:
  contents: write

jobs:
  import-strategies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import personal strategies
        id: import
        run: |
          node strategy-importer/import-personal-strategies.mjs
          if git diff --quiet --exit-code data/Strategies.csv; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.import.outputs.changes == 'true'
        run: npm ci

      - name: Rebuild data and pages
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run build:data
          npm run build:pages

      - name: Commit and push import artifacts
        if: steps.import.outputs.changes == 'true'
        env:
          NOTE: ${{ inputs.note }}
          BRANCH_NAME: strategy-import/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add -A
          if [ -n "$NOTE" ]; then
            message="chore: import strategies - $NOTE"
          else
            message="chore: import strategies"
          fi
          git commit -m "$message"
          git push origin "$BRANCH_NAME"

      - name: Summary
        run: |
          if [ "${{ steps.import.outputs.changes }}" = "true" ]; then
            echo "Imported strategies and rebuilt site content." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new strategies were imported from strategy-importer/." >> "$GITHUB_STEP_SUMMARY"
          fi
