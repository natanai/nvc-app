name: Strategy Importer

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      note:
        description: Optional note about the incoming batch
        required: false

permissions:
  contents: write

concurrency:
  group: strategy-importer-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  import-strategies:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import personal strategies
        id: import
        run: |
          node strategy-importer/import-personal-strategies.mjs
          if git diff --quiet --exit-code data/Strategies.csv; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.import.outputs.changes == 'true'
        run: npm ci

      - name: Rebuild only strategy-owned data and pages
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run build:data -- --scope index
          npm run build:pages -- --scope needs

      - name: Reject collateral changes
        if: steps.import.outputs.changes == 'true'
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(data/Strategies\.csv|data/index\.json|needs/index\.html|needs/[^/]+/index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error title=Strategy import changed files it does not own::The strategy importer may update Strategies.csv, data/index.json, and generated Need pages only."
            echo "$unexpected"
            exit 1
          fi

      - name: Validate imported site state
        if: steps.import.outputs.changes == 'true'
        run: |
          npm run test:data-integrity
          node --test tests/shared-density-polish.test.mjs
          node tests/nav-magnet-coverage.test.mjs

      - name: Commit and push import artifacts
        if: steps.import.outputs.changes == 'true'
        env:
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$NOTE" ]; then
            message="chore: import strategies - $NOTE"
          else
            message="chore: import strategies"
          fi

          # Stage the workflow's declared ownership surface only. Never use
          # `git add -A` in a content-import workflow.
          git add -- data/Strategies.csv data/index.json needs
          git commit -m "$message"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Summary
        run: |
          if [ "${{ steps.import.outputs.changes }}" = "true" ]; then
            echo "Imported strategies, rebuilt only the affected data/Need pages, validated them, and pushed to: ${{ env.TARGET_BRANCH }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new strategies were imported from strategy-importer/." >> "$GITHUB_STEP_SUMMARY"
          fi
