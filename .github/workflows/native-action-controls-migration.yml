name: Native Action Controls Migration

on:
  pull_request:
    branches: [inventory-core-overhaul]

jobs:
  migrate:
    if: ${{ github.head_ref == 'bedrock/production-finalization-v2' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect pending migration
        id: detect
        shell: bash
        run: |
          if [ -f .github/scripts/native-action-controls-migration.py ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.pending == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.pending == 'true'
        run: npm ci

      - name: Apply compact action-control repair
        if: steps.detect.outputs.pending == 'true'
        run: |
          sed -i '0,/expected=3,/s//expected=4,/' .github/scripts/native-action-controls-migration.py
          python3 .github/scripts/native-action-controls-migration.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/inventory.js')
          text = path.read_text(encoding='utf-8')
          old_reset = """    state.inventoryEditingId = null;
              state.inventorySubmitButton.textContent = 'Device';
              state.inventoryForm.removeAttribute('data-editing');"""
          new_reset = """    state.inventoryEditingId = null;
              state.inventorySubmitButton.textContent = 'Device';
              state.inventorySubmitButton.setAttribute('aria-label', 'Save to device');
              state.inventorySubmitButton.setAttribute('title', 'Save to device');
              state.inventoryForm.removeAttribute('data-editing');"""
          old_edit = """  state.inventoryEditingId = entry.id;
            state.inventoryForm.setAttribute('data-editing', 'true');
            state.inventorySubmitButton.textContent = '💾 Save changes to device';"""
          new_edit = """  state.inventoryEditingId = entry.id;
            state.inventoryForm.setAttribute('data-editing', 'true');
            state.inventorySubmitButton.textContent = 'Save changes';
            state.inventorySubmitButton.setAttribute('aria-label', 'Save changes to device');
            state.inventorySubmitButton.setAttribute('title', 'Save changes to device');"""

          if old_reset not in text:
              raise SystemExit('Inventory new-entry action-state anchor not found after migration')
          if old_edit not in text:
              raise SystemExit('Inventory edit action-state anchor not found after migration')
          text = text.replace(old_reset, new_reset, 1).replace(old_edit, new_edit, 1)
          path.write_text(text, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          for redundant in ('  justify-content: stretch;\n', '  align-self: stretch;\n'):
              if redundant not in styles:
                  raise SystemExit(f'Redundant compact-control declaration missing: {redundant.strip()}')
              styles = styles.replace(redundant, '', 1)
          styles_path.write_text(styles.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Remove migration script before validation
        if: steps.detect.outputs.pending == 'true'
        run: rm -f .github/scripts/native-action-controls-migration.py

      - name: Validate UI and Bedrock contracts
        if: steps.detect.outputs.pending == 'true'
        run: |
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:obsolete
          npm run test:performance
          npm run lint:entrypoints
          npm run build
          git diff --check

      - name: Publish compact action-control repair
        if: steps.detect.outputs.pending == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/native-action-controls-migration.yml'
          git diff --cached --check
          git commit -m "Modernize compact save and Journal controls"
          git push origin HEAD:"${HEAD_REF}"
