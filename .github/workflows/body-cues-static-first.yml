name: Body Cues static-first repair

on:
  push:
    branches:
      - fix/body-cues-static-first-desktop
    paths:
      - .github/workflows/body-cues-static-first.yml
      - scripts/apply-body-cues-static-first.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/body-cues-static-first-desktop
          fetch-depth: 0

      - name: Apply source repair
        run: python3 scripts/apply-body-cues-static-first.py

      - name: Validate JavaScript syntax
        run: node --check scripts/body-cues-tool.js && node --check scripts/build-pages.mjs

      - name: Regenerate feelings pages
        run: node scripts/build-pages.mjs --scope feelings

      - name: Verify static-first Body Cues contract
        run: node tests/body-cues-static-first.test.mjs

      - name: Run focused regression checks
        run: |
          npm run test:flicker-jitter
          npm run test:nav-magnets
          git diff --check

      - name: Commit repaired sources and generated page
        run: |
          rm -f .github/workflows/body-cues-static-first.yml scripts/apply-body-cues-static-first.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-pages.mjs \
            scripts/body-cues-tool.js \
            styles/body-cues.css \
            feelings/body-cues/index.html \
            tests/body-cues-static-first.test.mjs \
            .github/workflows/body-cues-static-first.yml \
            scripts/apply-body-cues-static-first.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make Body Cues static-first and repair desktop layout"
          git push origin HEAD:fix/body-cues-static-first-desktop
