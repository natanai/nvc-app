name: Apply Observations Overflow Root Fix Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-observations-overflow-root-fix.trigger'

permissions:
  contents: write

jobs:
  apply-root-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove root cause and old workaround
        run: node scripts/apply-observations-overflow-root-fix.mjs

      - name: Run focused checks
        run: |
          node --check assets/js/observation-editor.js
          npm run test:nav-magnets
          npm run test:flicker-jitter
          grep -q 'flex-wrap: wrap;' observations/index.html
          if grep -A8 -B1 '@media (max-width: 460px)' observations/index.html | grep -q 'overflow-x: auto'; then
            echo 'The <=460px Observations block still enables horizontal scrolling.'
            exit 1
          fi
          if grep -q 'resetObservationHorizontalScroll\|resetObservationPageFocusState' assets/js/observation-editor.js; then
            echo 'Legacy forced horizontal-scroll reset remains.'
            exit 1
          fi

      - name: Confirm only intended site files changed
        run: |
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(observations/index\.html|assets/js/observation-editor\.js)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected site changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove temporary diagnostic and integration machinery
        run: git rm .github/workflows/diagnose-observations-overflow.yml .github/workflows/apply-observations-overflow-root-fix.yml scripts/apply-observations-overflow-root-fix.mjs

      - name: Commit root fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observations/index.html assets/js/observation-editor.js
          git commit -m "Remove mobile Observations horizontal overflow source"
          git push origin HEAD:ux-audit
