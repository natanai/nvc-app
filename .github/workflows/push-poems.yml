name: Push Poems

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update (published branch by default)'
        required: true
        default: inventory-core-overhaul
      run_build_pages:
        description: 'Rebuild feelings pages after updating data'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: push-poems-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  push-poems:
    name: Publish poems to site
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild datasets
        run: npm run build:data

      - name: Rebuild feelings pages
        if: ${{ inputs.run_build_pages != 'false' }}
        run: |
          node scripts/build-pages.mjs --scope=feelings,faux-feelings
          node scripts/finalize-static-assets.mjs

      - name: Commit and push updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected after rebuild."
            exit 0
          fi
          git add -A
          git commit -m "Update poems from poems_formatted.txt"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Summarize updates
        run: |
          if [ "${{ steps.commit.outputs.changes }}" = "true" ]; then
            SUMMARY="Push Poems committed updates to ${{ env.TARGET_BRANCH }}."
          else
            SUMMARY="Push Poems completed with no changes to commit."
          fi
          {
            echo "## Push Poems"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
