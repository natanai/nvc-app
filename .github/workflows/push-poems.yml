name: Push Poems

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update (published branch by default)'
        required: true
        default: inventory-core-overhaul

permissions:
  contents: write

concurrency:
  group: nvc-app-write-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  push-poems:
    name: Publish poems to site
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild datasets
        run: npm run build:data

      - name: Rebuild feelings pages
        run: node scripts/build-pages.mjs --scope=feelings,faux-feelings

      - name: Verify poem rebuild stability and scope
        run: |
          npm run verify:feelings-idempotent
          npm run guard:workflow-output -- push-poems
          npm run test:generator-stability
          npm run test:data-integrity

      - name: Commit and push updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected after rebuild."
            exit 0
          fi
          git add data/index.json data/body-regions.json data/reverse-inference.json feelings faux-feelings
          git commit -m "Update poems from poems_formatted.txt"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Summarize updates
        run: |
          if [ "${{ steps.commit.outputs.changes }}" = "true" ]; then
            SUMMARY="Push Poems validated and committed updates to ${{ env.TARGET_BRANCH }}."
          else
            SUMMARY="Push Poems completed with no changes to commit."
          fi
          {
            echo "## Push Poems"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
