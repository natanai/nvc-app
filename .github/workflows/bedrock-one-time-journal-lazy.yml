name: Bedrock one-time lazy Journal refactor

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  lazy-journal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Journal ownership transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file_path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/inventory.js',
              """  if (!panel) {
            setupStandaloneJournalOverlay();
            registerJournalStoreListeners();
            return;
          }""",
              """  if (!panel) {
            setupJournalOverlay();
            registerJournalStoreListeners();
            return;
          }""",
          )

          replace_once(
              'scripts/inventory.js',
              """  state.journalOverlayActiveTrigger = button;
          openJournalOverlay();""",
              """  if (!state.journalFormSectionEl) {
            setupStandaloneJournalOverlay();
            loadJournalReferenceData();
          }
          state.journalOverlayActiveTrigger = button;
          openJournalOverlay();""",
          )

          replace_once(
              'scripts/inventory.js',
              """  state.journalOverlayActiveTrigger = trigger;
          openJournalOverlay();""",
              """  if (!state.journalFormSectionEl) {
            setupStandaloneJournalOverlay();
            loadJournalReferenceData();
          }
          state.journalOverlayActiveTrigger = trigger;
          openJournalOverlay();""",
          )

          replace_once(
              'scripts/inventory.js',
              """  setupJournalSection();
            renderJournalViews();
            loadJournalReferenceData();
            setupScrollTopButton();""",
              """  setupJournalSection();
            renderJournalViews();
            if (document.querySelector('[data-inventory-section=\"journal\"]')) {
              loadJournalReferenceData();
            }
            setupScrollTopButton();""",
          )

          replace_once(
              'scripts/build-pages.mjs',
              """  const baseScripts = [
              { src: 'assets/js/journal/store.js', module: true },
              { src: 'scripts/inventory-core-shell.js', defer: true },""",
              """  const baseScripts = [
              { src: 'scripts/inventory-core-shell.js', defer: true },""",
          )

          replace_once(
              'feed/index.html',
              '    <script src="../assets/js/journal/store.js" type="module"></script>\n',
              '',
          )
          PY

      - name: Regenerate declared page outputs
        run: npm run build:pages

      - name: Verify diff scope
        run: |
          unexpected=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              scripts/inventory.js|scripts/build-pages.mjs|feed/index.html|index.html|alexithymia-support/index.html|observations/index.html|faux-feelings/index.html|faux-feelings/*/index.html|needs/index.html|needs/*/index.html|inventory/index.html|inventory/journal/index.html|feelings/index.html|feelings/body-cues/index.html|feelings/*/index.html)
                if [ "$file" = "feelings/emotions-wheel/index.html" ]; then
                  unexpected="${unexpected}${file}\n"
                fi
                ;;
              *)
                unexpected="${unexpected}${file}\n"
                ;;
            esac
          done < <(git diff --name-only)

          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            printf '%b' "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit lazy Journal graph and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-journal-lazy.yml
          while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done < <(git diff --name-only)
          git commit -m "Load Journal runtime only when needed"
          git push origin HEAD:bedrock/production-finalization-v2
