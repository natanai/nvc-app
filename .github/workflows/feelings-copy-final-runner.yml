name: Final guarded feelings copy runner

on:
  pull_request:
    branches: [ux-audit]
    paths:
      - '.github/feelings-copy-final-trigger'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'ux-audit-feelings-copy-safe-run-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply only approved source and static-page copy changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, os

          old = '<span class="feeling-inference-toggle__label">How this feeling might be inferred</span>'
          new = '<span class="feeling-inference-toggle__label">How this feeling may show up</span>'

          generator = Path('scripts/build-pages.mjs')
          before = generator.read_text()
          if before.count(old) != 1:
              raise SystemExit(f'Expected exactly one old generator label; found {before.count(old)}')
          generator.write_text(before.replace(old, new, 1))

          runtime = Path('scripts/feeling-reverse-inference.js')
          runtime_before = runtime.read_text()
          pattern = re.compile(
              r"\n  const toggleLabel = toggle\.querySelector\('\.feeling-inference-toggle__label'\);\n"
              r"  if \(toggleLabel\) \{\n"
              r"    toggleLabel\.textContent = 'How this feeling may show up';\n"
              r"  \}\n"
          )
          runtime_after, count = pattern.subn('\n', runtime_before, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one runtime label swap; found {count}')
          for required in [
              "'Typical intensity'",
              "'Typical pattern'",
              "'Possible body cues'",
              "'Relative importance'",
              "'Possible patterns—not rules or diagnoses. Your experience may differ.'",
          ]:
              if required not in runtime_after:
                  raise SystemExit(f'Missing tightened inference copy: {required}')
          runtime.write_text(runtime_after)

          targets = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if not (path.startswith('feelings/') and path.endswith('/index.html')):
                  continue
              page = Path(path)
              text = page.read_text()
              if old not in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one old label, found {text.count(old)}')
              page.write_text(text.replace(old, new, 1))
              targets.append(path)
          if len(targets) != 48:
              raise SystemExit(f'Expected the previously audited 48 generated feeling pages; found {len(targets)}. Refusing to continue on a changed base.')
          Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').write_text('\n'.join(targets) + '\n')
          print(f'Patched exactly {len(targets)} audited feeling pages.')
          PY

      - name: Verify exact diff and Inventory isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          old = '<span class="feeling-inference-toggle__label">How this feeling might be inferred</span>'
          new = '<span class="feeling-inference-toggle__label">How this feeling may show up</span>'
          targets = [x for x in Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').read_text().splitlines() if x]
          allowed = set(targets) | {'scripts/build-pages.mjs', 'scripts/feeling-reverse-inference.js'}

          dirty = []
          for line in subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              dirty.append(path)
          unexpected = sorted(set(dirty) - allowed)
          if unexpected:
              raise SystemExit('Unexpected paths changed:\n' + '\n'.join(unexpected))
          if any(p.startswith('inventory/') for p in dirty):
              raise SystemExit('Inventory changed unexpectedly.')

          gb = subprocess.check_output(['git','show','HEAD:scripts/build-pages.mjs'], text=True)
          if Path('scripts/build-pages.mjs').read_text() != gb.replace(old, new, 1):
              raise SystemExit('Generator changed beyond approved label replacement.')

          rb = subprocess.check_output(['git','show','HEAD:scripts/feeling-reverse-inference.js'], text=True)
          pattern = re.compile(
              r"\n  const toggleLabel = toggle\.querySelector\('\.feeling-inference-toggle__label'\);\n"
              r"  if \(toggleLabel\) \{\n"
              r"    toggleLabel\.textContent = 'How this feeling may show up';\n"
              r"  \}\n"
          )
          expected_rb, count = pattern.subn('\n', rb, count=1)
          if count != 1 or Path('scripts/feeling-reverse-inference.js').read_text() != expected_rb:
              raise SystemExit('Runtime JS changed beyond removal of the post-paint label swap.')

          for path in targets:
              pb = subprocess.check_output(['git','show',f'HEAD:{path}'], text=True)
              if pb.count(old) != 1 or Path(path).read_text() != pb.replace(old,new,1):
                  raise SystemExit(f'{path}: changed beyond approved static-label replacement.')
          print('Exact diff allowlist passed; Inventory is untouched.')
          PY

      - name: Compare all checks against unmodified baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, tempfile, re, shutil

          root = Path.cwd().resolve()
          baseline = Path(tempfile.mkdtemp()).resolve()
          subprocess.run(['git','worktree','add','--detach',str(baseline),'HEAD'], check=True)

          checks = [
              ('data-integrity', ['npm','run','test:data-integrity']),
              ('customizer', ['npm','run','test:customizer']),
              ('flicker-jitter', ['npm','run','test:flicker-jitter']),
              ('nav-magnets', ['npm','run','test:nav-magnets']),
              ('entrypoints', ['npm','run','lint:entrypoints']),
          ]

          def normalize(text, cwd):
              text = text.replace(str(cwd), '<ROOT>')
              text = text.replace(cwd.as_uri(), 'file://<ROOT>')
              text = re.sub(r'^Generated: .*$', 'Generated: <TIMESTAMP>', text, flags=re.M)
              return text

          try:
              for name, cmd in checks:
                  b = subprocess.run(cmd, cwd=baseline, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  p = subprocess.run(cmd, cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(f'{name}: baseline={b.returncode}, patched={p.returncode}')

                  if b.returncode == 0 and p.returncode != 0:
                      print(p.stdout)
                      raise SystemExit(f'{name}: patch introduced a new failure')
                  if b.returncode != 0 and p.returncode == 0:
                      print(f'{name}: patch improves an existing baseline failure; accepting.')
                      continue
                  if b.returncode != 0 and p.returncode != 0:
                      bn = normalize(b.stdout, baseline)
                      pn = normalize(p.stdout, root)
                      if bn != pn:
                          print('--- baseline normalized output ---')
                          print(bn)
                          print('--- patched normalized output ---')
                          print(pn)
                          raise SystemExit(f'{name}: failing output differs from baseline')
                      print(f'{name}: existing baseline failure is unchanged.')
                  else:
                      print(f'{name}: passes on baseline and patch.')
          finally:
              subprocess.run(['git','worktree','remove','--force',str(baseline)], check=False)
              shutil.rmtree(baseline, ignore_errors=True)

          # Restore/remove reports created by checks so they cannot enter the commit.
          for rel in ['data/reports/data-integrity-report.md','data/reports/missing-vocabulary.csv']:
              tracked = subprocess.run(['git','ls-files','--error-unmatch',rel], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if tracked:
                  subprocess.run(['git','restore','--source=HEAD','--',rel], check=True)
              else:
                  Path(rel).unlink(missing_ok=True)
          PY

      - name: Re-verify allowlist after tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          targets = [x for x in Path(os.environ['RUNNER_TEMP'], 'feelings_target_paths').read_text().splitlines() if x]
          allowed = set(targets) | {'scripts/build-pages.mjs','scripts/feeling-reverse-inference.js'}
          dirty=[]
          for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              dirty.append(path)
          extra=sorted(set(dirty)-allowed)
          if extra: raise SystemExit('Tests left unexpected changes:\n'+'\n'.join(extra))
          if any(p.startswith('inventory/') for p in dirty): raise SystemExit('Inventory changed unexpectedly.')
          print('Post-test allowlist passed; Inventory remains untouched.')
          PY

      - name: Commit verified candidate and remove trigger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/feelings-copy-final-trigger
          git add scripts/build-pages.mjs scripts/feeling-reverse-inference.js feelings
          git commit -m 'Apply feeling inference copy without runtime swap'

      - name: Push only if isolated feature branch has not moved
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin ux-audit-feelings-copy-safe-run-2
          REMOTE_SHA="$(git rev-parse origin/ux-audit-feelings-copy-safe-run-2)"
          if [ "$REMOTE_SHA" != "$EXPECTED_HEAD" ]; then
            echo "Feature branch moved from $EXPECTED_HEAD to $REMOTE_SHA; refusing to overwrite it." >&2
            exit 1
          fi
          git push origin HEAD:ux-audit-feelings-copy-safe-run-2
