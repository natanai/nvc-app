name: Bedrock strategy density owner runner

on:
  push:
    branches: [bedrock/production-finalization-v2]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Move strategy density to its shared owner
        shell: bash
        run: |
          node .github/scripts/bedrock-strategy-density-owner.mjs
          rm .github/scripts/bedrock-strategy-density-owner.mjs
          rm .github/workflows/bedrock-strategy-density-owner-runner.yml
          npm ci --ignore-scripts
          node --test tests/acceptance-interaction-regressions.test.mjs
          npm run test:flicker-jitter
          npm run test:performance
          npm run build
          npm run test:generator-ownership
          npm run test:obsolete
          git diff --check
      - name: Commit shared density ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move strategy desktop density to shared owner" || exit 0
          git push origin HEAD:bedrock/production-finalization-v2
