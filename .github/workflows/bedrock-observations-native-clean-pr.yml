name: One-time Observations native cleanup PR trigger

on:
  pull_request:
    branches: [inventory-core-overhaul]
    paths:
      - '.github/workflows/bedrock-observations-native-clean-pr.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical Observations cleanup
        run: node .github/scripts/bedrock-observations-native-clean.mjs

      - name: Normalize desktop disclosure chevrons
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'styles/observations.css';
          let css = fs.readFileSync(path, 'utf8');
          function matchingBrace(source, open) {
            let depth = 0, quote = '', escaped = false;
            for (let i = open; i < source.length; i += 1) {
              const ch = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '{') depth += 1;
              if (ch === '}' && --depth === 0) return i;
            }
            throw new Error('Unbalanced CSS');
          }
          function replaceRule(selector, body) {
            const start = css.indexOf(selector);
            if (start < 0) throw new Error(`Missing base rule: ${selector}`);
            const open = css.indexOf('{', start + selector.length);
            const end = matchingBrace(css, open);
            css = css.slice(0, start) + `${selector} {\n${body}\n  }` + css.slice(end + 1);
          }
          replaceRule('  .observation-overview__summary-icon', `    display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: auto;
            height: auto;
            min-width: 0;
            min-height: 0;
            margin-left: auto;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: color-mix(in srgb, var(--ink-soft) 72%, transparent);
            font-size: 1.35rem;
            font-weight: 500;
            line-height: 1;
            box-shadow: none;
            transition: transform 0.16s ease;`);
          replaceRule('  .observation-overview__details[open] .observation-overview__summary-icon', `    transform: rotate(90deg);
            background: transparent;`);
          replaceRule('  .observation-guide__toggle-icon', `    display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: auto;
            height: auto;
            min-width: 0;
            min-height: 0;
            margin-left: auto;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: color-mix(in srgb, var(--ink-soft) 72%, transparent);
            font-size: 1.35rem;
            font-weight: 500;
            line-height: 1;
            box-shadow: none;
            transition: transform 0.16s ease;`);
          replaceRule('  .observation-guide[open] .observation-guide__toggle-icon', `    transform: rotate(90deg);`);
          fs.writeFileSync(path, css);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate focused and Bedrock contracts
        run: |
          node --test tests/observations-native-language.test.mjs
          node --test tests/shared-density-polish.test.mjs
          npm run test:data-integrity
          npm run test:flicker-jitter
          npm run test:performance
          npm run test:generator-ownership
          npm run test:obsolete

      - name: Verify canonical build stability
        env:
          LINK_CHECK_REPORT_ONLY: '1'
        run: |
          npm run build
          git diff --binary > /tmp/observations-build-1.diff
          npm run build
          git diff --binary > /tmp/observations-build-2.diff
          cmp /tmp/observations-build-1.diff /tmp/observations-build-2.diff
          git diff --check

      - name: Verify consolidated ownership
        shell: bash
        run: |
          test -f styles/observations.css
          test ! -e styles/observations-critical.css
          test ! -e styles/observations-mobile.css
          if grep -R -n -E 'observations-(critical|mobile)[.]css' README.md docs scripts tests observations package.json; then
            echo 'Retired Observations stylesheet reference remains.' >&2
            exit 1
          fi

      - name: Remove one-time scaffolding
        run: |
          rm .github/scripts/bedrock-observations-native-clean.mjs
          rm .github/workflows/bedrock-observations-native-clean.yml
          rm .github/workflows/bedrock-observations-native-clean-pr.yml

      - name: Commit canonical cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Consolidate Observations native visual language'
          git push origin HEAD:performance/immediate-response-v1
