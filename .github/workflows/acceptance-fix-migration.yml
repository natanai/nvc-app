name: Acceptance Fix Migration

on:
  pull_request:
    branches: [inventory-core-overhaul]

jobs:
  migrate:
    if: ${{ github.head_ref == 'bedrock/production-finalization-v2' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect pending migration
        id: detect
        shell: bash
        run: |
          if [ -f .github/scripts/acceptance-fix-migration.py ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.pending == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.pending == 'true'
        run: npm ci

      - name: Apply acceptance repairs
        if: steps.detect.outputs.pending == 'true'
        run: python3 .github/scripts/acceptance-fix-migration.py

      - name: Validate acceptance repairs
        if: steps.detect.outputs.pending == 'true'
        run: |
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:obsolete
          npm run test:performance
          npm run lint:entrypoints
          git diff --check

      - name: Publish acceptance repairs
        if: steps.detect.outputs.pending == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/scripts/acceptance-fix-migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix manual magnet persistence and Journal save feedback"
          git push origin HEAD:"${HEAD_REF}"
