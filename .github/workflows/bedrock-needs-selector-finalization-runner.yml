name: Bedrock Needs selector finalization runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical Needs selector repair
        shell: bash
        run: |
          node .github/scripts/bedrock-needs-selector-finalize.mjs
          rm .github/scripts/bedrock-needs-selector-finalize.mjs
          rm .github/workflows/bedrock-needs-selector-finalization-runner.yml
          npm ci --ignore-scripts
          node --check assets/js/catalog-multiselect.js
          node --check scripts/inventory.js
          node --test tests/acceptance-interaction-regressions.test.mjs
          npm run test:flicker-jitter
          npm run build
          npm run test:generator-ownership
          npm run test:obsolete
          git diff --check
      - name: Commit Bedrock selector repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strategy Needs selector overflow contract" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
