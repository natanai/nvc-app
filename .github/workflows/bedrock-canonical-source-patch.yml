name: Bedrock Canonical Source Patch

on:
  push:
    branches:
      - bedrock/production-finalization-v2
    paths:
      - .github/workflows/bedrock-canonical-source-patch.yml

permissions:
  contents: write

jobs:
  patch-page-compiler:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 1

      - name: Preserve deployed shell script order in canonical compiler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-pages.mjs')
          source = path.read_text()
          old = """  const baseScripts = [
            { src: 'scripts/inventory-core-shell.js', defer: true },
            ...(includeInventoryRuntime ? [{ src: 'scripts/inventory.js', defer: true }] : []),
            { src: 'scripts/magnets.js', module: true },
          ];"""
          new = """  const baseScripts = [
            ...(includeInventoryRuntime ? [{ src: 'scripts/inventory.js', defer: true }] : []),
            { src: 'scripts/inventory-core-shell.js', defer: true },
            { src: 'scripts/magnets.js', module: true },
          ];"""
          if old not in source:
              raise SystemExit('Expected normalizeScripts baseScripts block was not found; refusing to patch.')
          updated = source.replace(old, new, 1)
          if updated.count(new) != 1:
              raise SystemExit('Canonical baseScripts block was not produced exactly once.')
          path.write_text(updated)
          PY
          node --check scripts/build-pages.mjs
          git diff --check

      - name: Commit canonical compiler source
        shell: bash
        run: |
          if git diff --quiet -- scripts/build-pages.mjs; then
            echo "Compiler already has the canonical script order."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs
          git commit -m "Canonicalize page compiler shell script order"
          git push origin HEAD:bedrock/production-finalization-v2
