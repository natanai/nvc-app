name: Apply Inventory Filter Mobile Fix Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/inventory-filter-mobile-fix.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-filter-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Inventory filter sizing in generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/build-pages.mjs')
          text = path.read_text()
          pattern = re.compile(
              r"(\.inventory-summary__filter-button \{\s*\n\s*min-height: 38px;\s*\n\s*min-width: 0;\s*\n)\s*padding: 0\.38rem 0\.7rem;"
          )
          replacement = (
              r"\1"
              "        width: auto;\n"
              "        height: auto;\n"
              "        max-width: none;\n"
              "        padding: 0.42rem 0.74rem;\n"
              "        white-space: nowrap;\n"
              "        line-height: 1.1;\n"
              "        flex: 0 0 auto;"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one prototype filter rule, patched {count}')
          path.write_text(text)
          PY

      - name: Regenerate Inventory only
        run: node scripts/build-pages.mjs --scope inventory

      - name: Verify intended result
        run: |
          grep -n "white-space: nowrap" inventory/index.html
          grep -n "width: auto" inventory/index.html
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|inventory/index\.html|\.github/workflows/apply-inventory-filter-mobile-fix-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-inventory-filter-mobile-fix-once.yml

      - name: Commit Inventory mobile filter repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs inventory/index.html
          git commit -m "Repair Inventory mobile filter sizing"
          git push origin HEAD:ux-audit
