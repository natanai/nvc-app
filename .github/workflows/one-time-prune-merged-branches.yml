name: One-time merged branch cleanup

on:
  push:
    branches:
      - inventory-core-overhaul

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.event.head_commit.message == 'Run one-time merged branch cleanup'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: inventory-core-overhaul
      MAINTENANCE_BRANCH: maintenance/prune-merged-branches-2026-08-23
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          ref: inventory-core-overhaul
          fetch-depth: 0

      - name: Fetch every remote branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Prune branches already merged into the production baseline
        shell: bash
        run: |
          set -euo pipefail

          before="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          echo "Remote branches before cleanup: $before"

          declare -A open_pr_heads=()
          while IFS= read -r branch; do
            [[ -n "$branch" ]] && open_pr_heads["$branch"]=1
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json headRefName --jq '.[].headRefName')

          keep_branch() {
            case "$1" in
              "$DEFAULT_BRANCH"|\
              Stable|\
              backend|\
              backend-stable|\
              builder|\
              observations|\
              bedrock/full-pass-v1|\
              bedrock/production-finalization-v2|\
              stable-nav-magnets|\
              stability-generated-source-of-truth|\
              pre-ux-audit-2026-08-17|\
              ux-audit-v1-complete)
                return 0
                ;;
            esac
            [[ -n "${open_pr_heads[$1]:-}" ]]
          }

          mapfile -t merged < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              --merged="refs/remotes/origin/$DEFAULT_BRANCH" \
              refs/remotes/origin/ \
              | grep -v '^HEAD$' \
              | sort -u
          )

          delete=()
          for branch in "${merged[@]}"; do
            [[ -z "$branch" ]] && continue
            if ! keep_branch "$branch"; then
              delete+=("$branch")
            fi
          done

          echo "Fully merged branches eligible for deletion: ${#delete[@]}"

          batch=()
          deleted=0
          for branch in "${delete[@]}"; do
            batch+=("$branch")
            if (( ${#batch[@]} == 40 )); then
              git push origin --delete "${batch[@]}"
              deleted=$((deleted + ${#batch[@]}))
              batch=()
            fi
          done
          if (( ${#batch[@]} )); then
            git push origin --delete "${batch[@]}"
            deleted=$((deleted + ${#batch[@]}))
          fi

          # Remove the temporary branch used to stage this maintenance attempt, if present.
          if git ls-remote --exit-code --heads origin "$MAINTENANCE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$MAINTENANCE_BRANCH"
          fi

          after="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          echo "Remote branches after cleanup: $after"

          {
            echo "## Branch cleanup"
            echo
            echo "- Branches before: $before"
            echo "- Fully merged branches deleted: $deleted"
            echo "- Branches after cleanup: $after"
            echo "- Unmerged branches were preserved."
            echo "- Open-PR heads were preserved."
            echo "- Named landmark/long-lived branches were preserved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the one-time workflow from the default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-prune-merged-branches.yml
          git commit -m "Remove one-time merged branch cleanup workflow"
          git push origin HEAD:"$DEFAULT_BRANCH"
