name: One-time Observations critical style repair

on:
  push:
    branches:
      - performance/immediate-response-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Observations critical style repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply canonical Observations style repair
        run: node .github/scripts/repair-observations-critical-style.mjs
      - name: Rebuild through canonical owners
        run: npm run build
      - name: Verify behavior and ownership
        shell: bash
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          npm run test:delivery
          npm run test:generator-ownership
          npm run test:obsolete
      - name: Reject collateral changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              README.md|scripts/observation-guide.mjs|styles/observations-critical.css|observations/index.html|tests/magnet-prepaint.test.mjs|.github/scripts/repair-observations-critical-style.mjs|.github/workflows/repair-observations-critical-style.yml)
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //')
          exit "$bad"
      - name: Remove temporary migration scaffolding
        run: |
          rm .github/scripts/repair-observations-critical-style.mjs
          rm .github/workflows/repair-observations-critical-style.yml
      - name: Verify final canonical state
        shell: bash
        run: |
          npm run test:obsolete
          npm run build
          git diff --check
      - name: Commit repaired canary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Observations route-critical first paint"
          git push origin HEAD:performance/immediate-response-v1
