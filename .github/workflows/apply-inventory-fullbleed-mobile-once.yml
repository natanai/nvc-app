name: Apply Inventory Full-Bleed Mobile Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/inventory-fullbleed-mobile.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-fullbleed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Inventory mobile composition in generator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-pages.mjs')
          text = path.read_text()

          call_old = """    headExtras: blueskyPanelStyles,
              main,
              activeNav: 'inventory',
              canonicalPath: 'inventory/',
          """
          call_new = """    headExtras: blueskyPanelStyles,
              main,
              mainClass: 'page inventory-page',
              activeNav: 'inventory',
              canonicalPath: 'inventory/',
          """
          if text.count(call_old) != 1:
              raise SystemExit(f'Expected one Inventory htmlPage call anchor, found {text.count(call_old)}')
          text = text.replace(call_old, call_new, 1)

          mobile_old = """      @media (max-width: 640px) {
                .inventory-overview { padding: 0.7rem; border-radius: var(--radius-xl); }
                .inventory-view-panel__header { align-items: start; }
                .inventory-needs-status,
                .inventory-strategy-count { font-size: 0.72rem; }
                .inventory-summary__focus { min-height: 58px; padding: 0.62rem 0.65rem; gap: 0.58rem; }
                .inventory-summary__detail { padding: 0.62rem; }
                .inventory-header__quick-actions { grid-template-columns: minmax(0, 1fr); }
              }
          """
          mobile_new = """      @media (max-width: 640px) {
                /* Inventory is the app surface on phones, not a card inside the page. */
                .inventory-page {
                  width: calc(100% + 2rem);
                  margin-inline: -1rem;
                  padding: 1rem 0 2rem;
                  border: 0;
                  border-radius: 0;
                  box-shadow: none;
                  gap: 1rem;
                }

                .inventory-page .inventory-header,
                .inventory-page .inventory-form--collapsible,
                .inventory-page .inventory-actions--collapsible {
                  margin-inline: 1rem;
                }

                .inventory-page .inventory-main {
                  gap: 1rem;
                }

                .inventory-page .inventory-overview {
                  padding: 0;
                  border: 0;
                  border-radius: 0;
                  background: transparent;
                  box-shadow: none;
                  gap: 0.75rem;
                }

                .inventory-page .inventory-view-switch,
                .inventory-page .inventory-view-panel__header,
                .inventory-page .inventory-overview__tools,
                .inventory-page .inventory-strategy-search {
                  margin-inline: 1rem;
                }

                .inventory-page .inventory-view-panel__header {
                  align-items: start;
                }

                .inventory-page .inventory-summary {
                  border-left: 0;
                  border-right: 0;
                  border-radius: 0;
                  border-top: 1px solid color-mix(in srgb, var(--outline) 18%, transparent);
                  border-bottom: 1px solid color-mix(in srgb, var(--outline) 18%, transparent);
                }

                .inventory-page .inventory-summary__focus {
                  min-height: 60px;
                  padding: 0.72rem 1rem;
                  gap: 0.65rem;
                }

                .inventory-page .inventory-summary__detail {
                  padding: 0.72rem 1rem;
                }

                .inventory-page .inventory-list-panel {
                  margin-inline: 1rem;
                }

                .inventory-page .inventory-needs-status,
                .inventory-page .inventory-strategy-count {
                  font-size: 0.72rem;
                }

                .inventory-page .inventory-header__quick-actions {
                  grid-template-columns: minmax(0, 1fr);
                }
              }
          """
          if text.count(mobile_old) != 1:
              raise SystemExit(f'Expected one Inventory prototype mobile block, found {text.count(mobile_old)}')
          text = text.replace(mobile_old, mobile_new, 1)
          path.write_text(text)
          PY

      - name: Regenerate Inventory only
        run: node scripts/build-pages.mjs --scope inventory

      - name: Verify intended result
        run: |
          grep -n "mainClass: 'page inventory-page'" scripts/build-pages.mjs
          grep -n 'class="page inventory-page"' inventory/index.html
          grep -n 'Inventory is the app surface on phones' inventory/index.html
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|inventory/index\.html|\.github/workflows/apply-inventory-fullbleed-mobile-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-inventory-fullbleed-mobile-once.yml

      - name: Commit Inventory mobile full-bleed composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs inventory/index.html
          git commit -m "Flatten Inventory mobile composition"
          git push origin HEAD:ux-audit
