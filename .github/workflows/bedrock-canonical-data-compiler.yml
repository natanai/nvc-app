name: Bedrock canonical data compiler

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

jobs:
  canonicalize-data-compiler:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch and validate canonical data compiler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/bedrock-apply-data-compiler-migration.py')
          source = path.read_text()
          source = source.replace('    old_tail = """', '    old_tail = r"""', 1)
          source = source.replace('    new_tail = """', '    new_tail = r"""', 1)
          path.write_text(source)
          PY
          python scripts/bedrock-apply-data-compiler-migration.py
          git checkout -- scripts/bedrock-apply-data-compiler-migration.py

      - name: Commit compiler source only
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "scripts/build-data.mjs" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build-data.mjs
          git commit -m "Make data compiler reproduce reviewed production semantics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
