name: Flicker and Jitter Checker

on:
  pull_request:

jobs:
  flicker-and-jitter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run flicker and jitter check
        run: npm run test:flicker-jitter
