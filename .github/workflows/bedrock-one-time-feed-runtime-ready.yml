name: Bedrock one-time Feed runtime readiness

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  harden-feed-runtime-readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply exact readiness transform
        run: |
          python - <<'PY'
          from pathlib import Path

          feed_path = Path('scripts/strategy-feed.js')
          feed = feed_path.read_text(encoding='utf-8')
          anchor = """let oauthModulePromise = null;
          let inventoryRuntimePromise = null;
          let inventoryRuntimeReady = false;

          function ensureInventoryClassicRuntime() {
          """.replace('          ', '')
          replacement = """let oauthModulePromise = null;
          let inventoryRuntimePromise = null;
          let inventoryRuntimeReady = false;

          function finishAfterInventoryInitialization(resolve) {
            const finish = () => {
              inventoryRuntimeReady = true;
              resolve();
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', finish, { once: true });
            } else {
              finish();
            }
          }

          function ensureInventoryClassicRuntime() {
          """.replace('          ', '')
          if feed.count(anchor) != 1:
              raise SystemExit(f'Feed readiness anchor count: {feed.count(anchor)}')
          feed = feed.replace(anchor, replacement)

          old_finish = """  inventoryRuntimePromise = new Promise((resolve, reject) => {
            const finish = () => {
              inventoryRuntimeReady = true;
              resolve();
            };
          """.replace('          ', '')
          new_finish = """  inventoryRuntimePromise = new Promise((resolve, reject) => {
            const finish = () => finishAfterInventoryInitialization(resolve);
          """.replace('          ', '')
          if feed.count(old_finish) != 1:
              raise SystemExit(f'Feed finish block count: {feed.count(old_finish)}')
          feed_path.write_text(feed.replace(old_finish, new_finish), encoding='utf-8')

          test_path = Path('tests/runtime-load-graph.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = """  assert.ok(feed.includes('window.requestAnimationFrame(() => replayTrigger.click());'), 'held interactions should replay after the controller is ready');
          """.replace('          ', '')
          addition = marker + """  assert.ok(feed.includes('function finishAfterInventoryInitialization(resolve)'), 'Feed must distinguish script load from controller initialization');
            assert.ok(feed.includes(\"if (document.readyState === 'loading')\"), 'early Feed activation must wait for DOMContentLoaded');
            assert.ok(feed.includes(\"document.addEventListener('DOMContentLoaded', finish, { once: true });\"), 'Feed should release held interactions only after the controller initializer runs');
            assert.ok(feed.includes('const finish = () => finishAfterInventoryInitialization(resolve);'));
          """.replace('          ', '')
          if test.count(marker) != 1:
              raise SystemExit(f'Runtime test marker count: {test.count(marker)}')
          test_path.write_text(test.replace(marker, addition), encoding='utf-8')
          PY

      - name: Verify exact scope and protected tests
        run: |
          git diff --check
          node --check scripts/strategy-feed.js
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:home-regressions
          npm run test:nav-magnets
          npm run test:data-integrity

      - name: Prove authoring build stays byte-stable
        run: |
          git add scripts/strategy-feed.js tests/runtime-load-graph.test.mjs
          npm run build
          git diff --exit-code

      - name: Commit validated readiness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-feed-runtime-ready.yml
          git add scripts/strategy-feed.js tests/runtime-load-graph.test.mjs
          git diff --cached --check
          git commit -m "Wait for Feed controller initialization before replay"
          git push origin HEAD:bedrock/production-finalization-v2
