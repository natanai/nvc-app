name: Fact-Checking Spreadsheets

on:
  workflow_dispatch:
    inputs:
      commit-message:
        description: "Commit message for refreshed spreadsheets"
        required: false
        default: "chore: refresh fact-checking spreadsheets"

permissions:
  contents: write

jobs:
  export-fact-checking:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export fact-checking spreadsheets
        run: npm run export:fact-checking

      - name: Commit refreshed spreadsheets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ github.event.inputs.commit-message }}
          branch: ${{ env.TARGET_BRANCH }}
          file_pattern: fact-checking/**
