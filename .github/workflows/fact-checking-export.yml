name: Fact-Checking Spreadsheets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to refresh (published branch by default)"
        required: true
        default: "inventory-core-overhaul"
      commit_message:
        description: "Commit message for refreshed spreadsheets"
        required: false
        default: "chore: refresh fact-checking spreadsheets"

permissions:
  contents: write

concurrency:
  group: nvc-app-write-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  export-fact-checking:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export fact-checking spreadsheets
        run: npm run export:fact-checking

      - name: Commit refreshed spreadsheets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ inputs.commit_message }}
          branch: ${{ env.TARGET_BRANCH }}
          file_pattern: fact-checking/**
