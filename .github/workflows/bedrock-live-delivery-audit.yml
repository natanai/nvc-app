name: Bedrock Live Delivery Audit

on:
  pull_request:
    branches: [inventory-core-overhaul]

jobs:
  live-delivery-audit:
    if: ${{ github.head_ref == 'bedrock/production-finalization-v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live response delivery
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA:0:12}"
          inspect() {
            label="$1"
            url="$2"
            echo
            echo "===== ${label} ====="
            echo "${url}"
            curl -fsS --compressed --max-time 30 -o /dev/null -D - "${url}" \
              | tr -d '\r' \
              | grep -Ei '^(HTTP/|server:|cache-control:|content-type:|content-encoding:|etag:|last-modified:|age:|vary:|x-cache:|x-cache-hits:|x-served-by:|via:|cf-cache-status:|cf-ray:)' \
              || true
          }

          inspect "HTML fresh request" "https://allneeds.app/?bedrock-delivery-audit=${stamp}"
          inspect "CSS first request" "https://allneeds.app/styles.css?bedrock-delivery-audit=${stamp}"
          inspect "CSS repeated request" "https://allneeds.app/styles.css?bedrock-delivery-audit=${stamp}"
          inspect "JavaScript" "https://allneeds.app/scripts/magnets.js?bedrock-delivery-audit=${stamp}"
          inspect "SVG" "https://allneeds.app/icons/favicon-color.svg?bedrock-delivery-audit=${stamp}"
