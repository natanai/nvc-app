name: Apply Support Lane Controls V2 Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-support-lane-controls-v2.trigger'

permissions:
  contents: write

jobs:
  apply-support-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Support Lane control hierarchy
        run: node scripts/apply-support-lane-controls-v2.mjs

      - name: Run focused checks
        run: |
          node --check scripts/alexithymia-support.js
          npm run lint:evidence
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('alexithymia-support/index.html', 'utf8');
          const js = fs.readFileSync('scripts/alexithymia-support.js', 'utf8');
          if (!html.includes('Support Lane control hierarchy v2')) throw new Error('V2 Support CSS missing');
          if (html.includes('data-action="sensation-next"')) throw new Error('Redundant body Compass action remains');
          if (!html.includes('data-action="sensation-submit"')) throw new Error('Body Continue action missing');
          if (js.includes('finishGuidedScan()')) throw new Error('Undefined finishGuidedScan call remains');
          if (js.includes('handleSensationSkip')) throw new Error('Dead body skip handler remains');
          if ((html.match(/>Continue</g) || []).length < 1 && !html.includes('<span>Continue</span>')) throw new Error('Visible Continue label missing');
          const markerIndex = html.indexOf('Support Lane control hierarchy v2');
          const headEnd = html.indexOf('</head>');
          if (markerIndex < 0 || headEnd < 0 || markerIndex > headEnd) throw new Error('Support CSS is not in initial head');
          console.log('Support Lane V2 focused checks passed.');
          NODE

      - name: Confirm only intended durable files changed
        run: |
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(alexithymia-support/index\.html|scripts/alexithymia-support\.js)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected site changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot integration machinery
        run: git rm .github/workflows/apply-support-lane-controls-v2.yml scripts/apply-support-lane-controls-v2.mjs

      - name: Commit durable Support Lane control fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alexithymia-support/index.html scripts/alexithymia-support.js
          git commit -m "Clarify Support Lane progression controls"
          git push origin HEAD:ux-audit
