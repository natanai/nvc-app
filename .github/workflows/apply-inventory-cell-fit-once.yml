name: Apply Inventory Cell Fit Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/inventory-cell-fit.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-cell-fit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch adaptive Inventory cell fit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('scripts/inventory.js')
          js = js_path.read_text()
          old = """    const label = document.createElement('span');
              label.className = 'inventory-summary__label';
              label.textContent = need.title;
          """
          new = """    const label = document.createElement('span');
              label.className = 'inventory-summary__label';
              const longestNeedWord = need.title
                .trim()
                .split(/\\s+/)
                .reduce((longest, word) => Math.max(longest, word.length), 0);
              if (longestNeedWord >= 13) {
                label.classList.add('inventory-summary__label--compact');
              }
              label.textContent = need.title;
          """
          if js.count(old) != 1:
              raise SystemExit(f'Expected one Inventory label creation anchor, found {js.count(old)}')
          js = js.replace(old, new, 1)
          js_path.write_text(js)

          build_path = Path('scripts/build-pages.mjs')
          build = build_path.read_text()
          anchor = """      .inventory-page .inventory-summary__focus {
                min-height: 60px;
                padding: 0.72rem 1rem;
                gap: 0.65rem;
              }
          """
          replacement = """      .inventory-page .inventory-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
              }

              .inventory-page .inventory-summary__focus {
                min-width: 0;
                min-height: 60px;
                padding: 0.68rem 0.7rem;
                gap: 0.45rem;
              }

              .inventory-page .inventory-summary__status {
                width: 0.72rem;
                height: 0.72rem;
                flex: 0 0 auto;
              }

              .inventory-page .inventory-summary__text {
                min-width: 0;
              }

              .inventory-page .inventory-summary__label {
                font-size: 0.9rem;
                line-height: 1.16;
                letter-spacing: -0.01em;
                text-wrap: balance;
              }

              .inventory-page .inventory-summary__label--compact {
                font-size: 0.82rem;
                letter-spacing: -0.025em;
                white-space: nowrap;
              }

              .inventory-page .inventory-summary__count {
                font-size: 0.72rem;
                line-height: 1.2;
              }

              .inventory-page .inventory-summary__chevron {
                font-size: 1.08rem;
                flex: 0 0 auto;
              }
          """
          if build.count(anchor) != 1:
              raise SystemExit(f'Expected one mobile Inventory focus anchor, found {build.count(anchor)}')
          build = build.replace(anchor, replacement, 1)

          narrow_anchor = """      .inventory-page .inventory-header__quick-actions {
                grid-template-columns: minmax(0, 1fr);
              }
            }
          """
          narrow_replacement = """      .inventory-page .inventory-header__quick-actions {
                grid-template-columns: minmax(0, 1fr);
              }
            }

            @media (max-width: 350px) {
              .inventory-page .inventory-summary {
                grid-template-columns: minmax(0, 1fr);
              }

              .inventory-page .inventory-summary__label,
              .inventory-page .inventory-summary__label--compact {
                font-size: 0.9rem;
                letter-spacing: -0.01em;
                white-space: normal;
              }
            }
          """
          if build.count(narrow_anchor) != 1:
              raise SystemExit(f'Expected one Inventory mobile block ending anchor, found {build.count(narrow_anchor)}')
          build = build.replace(narrow_anchor, narrow_replacement, 1)
          build_path.write_text(build)
          PY

      - name: Regenerate Inventory only
        run: node scripts/build-pages.mjs --scope inventory

      - name: Verify focused behavior
        run: |
          node --check scripts/inventory.js
          grep -n 'inventory-summary__label--compact' scripts/inventory.js
          grep -n 'grid-template-columns: repeat(2, minmax(0, 1fr))' inventory/index.html
          grep -n '@media (max-width: 350px)' inventory/index.html
          npm run test:nav-magnets
          npm run test:flicker-jitter
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|scripts/inventory\.js|inventory/index\.html|\.github/workflows/apply-inventory-cell-fit-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-inventory-cell-fit-once.yml

      - name: Commit Inventory cell fit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs scripts/inventory.js inventory/index.html
          git commit -m "Refine Inventory mobile cell fit"
          git push origin HEAD:ux-audit
