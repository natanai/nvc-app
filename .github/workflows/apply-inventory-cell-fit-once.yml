name: Apply Inventory Cell Fit Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/inventory-cell-fit.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-cell-fit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch adaptive Inventory cell fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('scripts/inventory.js')
          js = js_path.read_text()
          js_pattern = re.compile(
              r"(?P<indent>\s*)const label = document\.createElement\('span'\);\n"
              r"(?P=indent)label\.className = 'inventory-summary__label';\n"
              r"(?P=indent)label\.textContent = need\.title;"
          )
          js_match = js_pattern.search(js)
          if not js_match:
              raise SystemExit('Inventory label creation anchor not found')
          indent = js_match.group('indent')
          js_replacement = (
              f"{indent}const label = document.createElement('span');\n"
              f"{indent}label.className = 'inventory-summary__label';\n"
              f"{indent}const longestNeedWord = need.title\n"
              f"{indent}  .trim()\n"
              f"{indent}  .split(/\\s+/)\n"
              f"{indent}  .reduce((longest, word) => Math.max(longest, word.length), 0);\n"
              f"{indent}if (longestNeedWord >= 13) {{\n"
              f"{indent}  label.classList.add('inventory-summary__label--compact');\n"
              f"{indent}}}\n"
              f"{indent}label.textContent = need.title;"
          )
          js, count = js_pattern.subn(js_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Inventory label patch, got {count}')
          js_path.write_text(js)

          build_path = Path('scripts/build-pages.mjs')
          build = build_path.read_text()
          css_pattern = re.compile(
              r"(?P<indent>\s*)\.inventory-page \.inventory-summary__focus \{\s*"
              r"min-height:\s*60px;\s*"
              r"padding:\s*0\.72rem 1rem;\s*"
              r"gap:\s*0\.65rem;\s*"
              r"\}"
          )
          css_match = css_pattern.search(build)
          if not css_match:
              raise SystemExit('Mobile Inventory focus block not found')
          i = css_match.group('indent')
          css_replacement = f"""{i}.inventory-page .inventory-summary {{
          {i}  grid-template-columns: repeat(2, minmax(0, 1fr));
          {i}}}

          {i}.inventory-page .inventory-summary__focus {{
          {i}  min-width: 0;
          {i}  min-height: 60px;
          {i}  padding: 0.68rem 0.7rem;
          {i}  gap: 0.45rem;
          {i}}}

          {i}.inventory-page .inventory-summary__status {{
          {i}  width: 0.72rem;
          {i}  height: 0.72rem;
          {i}  flex: 0 0 auto;
          {i}}}

          {i}.inventory-page .inventory-summary__text {{
          {i}  min-width: 0;
          {i}}}

          {i}.inventory-page .inventory-summary__label {{
          {i}  font-size: 0.9rem;
          {i}  line-height: 1.16;
          {i}  letter-spacing: -0.01em;
          {i}  text-wrap: balance;
          {i}}}

          {i}.inventory-page .inventory-summary__label--compact {{
          {i}  font-size: 0.82rem;
          {i}  letter-spacing: -0.025em;
          {i}  white-space: nowrap;
          {i}}}

          {i}.inventory-page .inventory-summary__count {{
          {i}  font-size: 0.72rem;
          {i}  line-height: 1.2;
          {i}}}

          {i}.inventory-page .inventory-summary__chevron {{
          {i}  font-size: 1.08rem;
          {i}  flex: 0 0 auto;
          {i}}}"""
          build, count = css_pattern.subn(css_replacement, build, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Inventory CSS patch, got {count}')
          build_path.write_text(build)
          PY

      - name: Regenerate Inventory only
        run: node scripts/build-pages.mjs --scope inventory

      - name: Verify focused behavior
        run: |
          node --check scripts/inventory.js
          grep -n 'inventory-summary__label--compact' scripts/inventory.js
          grep -n 'grid-template-columns: repeat(2, minmax(0, 1fr))' inventory/index.html
          npm run test:nav-magnets
          npm run test:flicker-jitter
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|scripts/inventory\.js|inventory/index\.html|\.github/workflows/apply-inventory-cell-fit-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-inventory-cell-fit-once.yml

      - name: Commit Inventory cell fit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs scripts/inventory.js inventory/index.html
          git commit -m "Refine Inventory mobile cell fit"
          git push origin HEAD:ux-audit
