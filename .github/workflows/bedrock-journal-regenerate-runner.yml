name: Bedrock Journal regenerate runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical pages
        run: npm run build:pages
      - name: Verify Journal and diff
        run: |
          node --test tests/final-hierarchy-ux.test.mjs tests/journal-initial-history-hydration.test.mjs
          git diff --check
      - name: Commit canonical generated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore canonical generated Journal'
      - name: Prove deterministic build
        run: |
          npm run build
          git diff --exit-code
        env:
          LINK_CHECK_REPORT_ONLY: '1'
      - run: git push origin HEAD:bedrock/production-finalization-v2
