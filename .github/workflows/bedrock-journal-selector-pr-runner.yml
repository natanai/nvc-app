name: Bedrock Journal selector PR runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair one-shot migration matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/.bedrock-journal-catalog-multiselect.mjs')
          source = path.read_text()
          old = '''  source = replaceOnce(source, "  needsMode: 'combobox',", "  needsMode: 'catalog-multiselect',", 'Journal needs mode');'''
          new = '''  source = source.replaceAll("  needsMode: 'combobox',", "  needsMode: 'catalog-multiselect',");'''
          if old not in source:
              raise SystemExit('needsMode matcher line not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply Journal catalog multi-select repair
        run: node scripts/.bedrock-journal-catalog-multiselect.mjs

      - name: Finish migrated Journal source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/journal/module.js')
          source = path.read_text()

          source = source.replace(
              '    this.draftPath = this.options.draftPath;    this.draftPath = this.options.draftPath;',
              '    this.draftPath = this.options.draftPath;',
              1,
          )
          source = source.replace(
              '''      emotion: "Begin typing to autocomplete from the feelings library, or leave it blank if you're unsure.",''',
              "      emotion: '',",
              1,
          )
          source = source.replace(
              "      needs: 'Begin typing to autocomplete needs from the library. Separate multiple needs with commas.',",
              "      needs: '',",
              1,
          )
          source = source.replace(
              "      needs: 'Start typing a need',",
              "      needs: 'Choose needs',",
              1,
          )
          source = source.replace(
              '''      if (focusNotes) this.notesInput.focus();\n      else this.notesInput.blur();''',
              '''      if (focusNotes) {\n        this.notesInput.focus();\n      } else {\n        this.notesInput.blur();\n      }''',
              1,
          )

          if 'this.draftPath = this.options.draftPath;    this.draftPath' in source:
              raise SystemExit('duplicate draftPath assignment remains')
          if 'Begin typing to autocomplete from the feelings library' in source:
              raise SystemExit('stale Feeling autocomplete hint remains')
          if 'Begin typing to autocomplete needs from the library' in source:
              raise SystemExit('stale Needs autocomplete hint remains')
          if "needs: 'Start typing a need'" in source:
              raise SystemExit('stale Needs typing placeholder remains')
          if 'if (focusNotes) {\n        this.notesInput.focus();' not in source:
              raise SystemExit('save-safe reset focus contract was not restored')
          path.write_text(source)
          PY

      - name: Regenerate canonical pages
        run: npm run build:pages

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify Journal selector contract
        run: node --test tests/journal-native-ux.test.mjs tests/native-action-controls.test.mjs tests/acceptance-interaction-regressions.test.mjs

      - name: Run Bedrock regressions
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node tests/body-cues-static-first.test.mjs
          npm run test:generator-ownership
          npm run test:performance
          npm run test:delivery

      - name: Verify canonical build
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Remove one-shot selector migration
        run: |
          rm -f scripts/.bedrock-journal-catalog-multiselect.mjs
          rm -f .bedrock-selector-trigger

      - name: Verify obsolete architecture stays gone
        run: npm run test:obsolete

      - name: Commit tested Bedrock result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use catalog multi-selectors for Journal feelings and needs'

      - name: Prove deterministic final head
        run: |
          npm run build
          git diff --exit-code
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Push tested Bedrock head
        run: git push origin HEAD:bedrock/production-finalization-v2
