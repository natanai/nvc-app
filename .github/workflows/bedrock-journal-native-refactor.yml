name: Bedrock Journal native refactor

on:
  push:
    branches: [bedrock/production-finalization-v2]

permissions:
  contents: write

concurrency:
  group: bedrock-journal-native-refactor
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical Journal refactor
        run: node scripts/.bedrock-journal-native-refactor.mjs

      - name: Regenerate canonical pages
        run: npm run build:pages

      - name: Check patch hygiene
        run: git diff --check

      - name: Run Journal native UX contract
        run: node --test tests/journal-native-ux.test.mjs

      - name: Run committed runtime and layout regressions
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node tests/body-cues-static-first.test.mjs
          npm run test:generator-ownership
          npm run test:obsolete
          npm run test:performance
          npm run test:delivery

      - name: Verify canonical authoring build
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Remove one-shot scaffolding
        run: |
          rm scripts/.bedrock-journal-native-refactor.mjs
          rm .github/workflows/bedrock-journal-native-refactor.yml

      - name: Commit final clean Bedrock head locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify Journal metadata and history UX'

      - name: Prove final build is byte deterministic
        run: |
          npm run build
          git diff --exit-code
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Push tested Bedrock head
        run: git push origin HEAD:bedrock/production-finalization-v2
