name: Static-first page repair

on:
  push:
    branches: [audit/static-first-page-architecture]

permissions:
  contents: write

concurrency:
  group: static-first-page-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Remove Inventory first-paint runtime repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/inventory-core-shell.js')
          source = path.read_text()

          if 'prepareInventoryExperience' in source:
              marker = "    shared: toSiteUrl(rootUrl, 'feed/'),\n  };\n\n  return `\n"
              replacement = """    shared: toSiteUrl(rootUrl, 'feed/'),
  };

  const personalShareAction = isInventoryWorkspace(rootUrl)
    ? `<button id=\"inventory-email-personal\" class=\"inventory-more-menu__row inventory-more-menu__button inventory-more-menu__personal-share\" type=\"button\" aria-label=\"Share your personal strategies with Nat\">
        <span class=\"inventory-more-menu__row-copy\">
          <span class=\"inventory-more-menu__row-title\">Share your strategies with Nat…</span>
          <span class=\"inventory-more-menu__row-note\">Export your personal strategies and prepare them to send</span>
        </span>
      </button>`
    : '';

  return `
"""
              if marker not in source:
                  raise SystemExit('Could not find menu insertion point')
              source = source.replace(marker, replacement, 1)

              source = source.replace('            <div data-menu-personal-share-slot hidden></div>', '            ${personalShareAction}', 1)

              source, count = re.subn(
                  r'\nfunction prepareInventoryExperience\(rootUrl\) \{[\s\S]*?\nfunction triggerCustomizer\(\) \{',
                  '\nfunction triggerCustomizer() {',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not remove Inventory runtime repair functions')

              source = source.replace('  const personalShareButton = prepareInventoryExperience(rootUrl);\n', '', 1)
              source = source.replace('  adoptPersonalShareAction(menu, personalShareButton);\n', '', 1)
              path.write_text(source)
          PY

      - name: Rebuild static pages
        run: npm run build:pages

      - name: Validate architecture and regressions
        run: |
          node --check scripts/inventory-core-shell.js
          node --check scripts/feeling-reverse-inference.js
          node --check assets/js/ui/contrast.js
          npm run test:static-first
          npm run test:flicker-jitter
          npm run test:nav-magnets
          git diff --check

      - name: Commit repair output
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No repair changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make remaining page presentation static-first"
          git push origin HEAD:audit/static-first-page-architecture
