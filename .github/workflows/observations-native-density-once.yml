name: One-shot Observations native density

on:
  push:
    branches:
      - performance/immediate-response-v1
    paths:
      - .github/workflows/observations-native-density-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v4
        with:
          ref: performance/immediate-response-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical mobile owner
        run: node .github/scripts/observations-native-density.mjs

      - name: Verify interaction and density contracts
        run: npm run test:flicker-jitter

      - name: Verify performance budgets
        run: npm run test:performance

      - name: Verify ownership and retired architecture
        run: |
          npm run test:generator-ownership
          npm run test:obsolete

      - name: Verify patch shape
        run: git diff --check

      - name: Commit canonical source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md observations/index.html styles/observations-mobile.css tests/shared-density-polish.test.mjs
          git commit -m "Refine Observations mobile density ownership"

      - name: Verify canonical build is zero-diff
        run: |
          npm run build
          git diff --exit-code

      - name: Remove one-time migration scaffolding
        run: |
          git rm .github/scripts/observations-native-density.mjs .github/workflows/observations-native-density-once.yml
          git commit -m "Remove one-time Observations density migration"

      - name: Push canary updates
        run: git push origin HEAD:performance/immediate-response-v1
