name: Bedrock stable hub decoration migration

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

concurrency:
  group: bedrock-stable-hub-decoration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate-stable-hub-decoration:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make generated hub poses stable before paint
        run: |
          node scripts/bedrock-migrate-stable-hub-decoration.mjs
          node --check scripts/build-pages.mjs
          node --check scripts/magnets.js
          npm run build:pages
          git diff --check

      - name: Verify migration ownership
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/build-pages\.mjs|scripts/magnets\.js|feelings/index\.html|needs/index\.html|faux-feelings/index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths changed by stable hub decoration migration:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          for required in scripts/build-pages.mjs scripts/magnets.js feelings/index.html needs/index.html faux-feelings/index.html; do
            if ! printf '%s\n' "$changed" | grep -qx "$required"; then
              echo "Expected migration output missing: $required"
              exit 1
            fi
          done

      - name: Verify existing magnet regressions
        run: |
          node --test tests/magnet-prepaint.test.mjs
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:generator-ownership

      - name: Prove generated pages are deterministic
        shell: bash
        run: |
          before="$(git diff)"
          npm run build:pages
          after="$(git diff)"
          if [ "$before" != "$after" ]; then
            echo "Second page build changed stable hub decoration output."
            git diff --stat
            exit 1
          fi

      - name: Commit stable first-frame hub poses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build-pages.mjs scripts/magnets.js feelings/index.html needs/index.html faux-feelings/index.html
          git commit -m "Keep saved hub magnet poses stable through hydration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
