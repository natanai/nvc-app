name: Bedrock one-time Home runtime canary v5

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  home-canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply auditable canary transform
        run: node scripts/bedrock-home-canary-transform.mjs

      - name: Regenerate Home through safe page build
        run: npm run build:pages

      - name: Verify canary change scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/bedrock-one-time-home-runtime-canary-v5.yml',
              'docs/bedrock-diagnostics/home-canary-v4-failure.txt',
              'index.html',
              'package.json',
              'scripts/bedrock-home-canary-transform.mjs',
              'scripts/build-pages.mjs',
              'scripts/inventory.js',
              'scripts/shell-runtime-loader.js',
              'tests/home-runtime-canary.test.mjs',
              'tests/journal-load-graph.test.mjs',
              'tests/shared-nav-menu.test.mjs',
          }
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines if len(line) > 3}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected changed paths: ' + ', '.join(unexpected))
          required = {
              'index.html', 'package.json', 'scripts/build-pages.mjs', 'scripts/inventory.js',
              'scripts/shell-runtime-loader.js', 'tests/home-runtime-canary.test.mjs',
              'tests/journal-load-graph.test.mjs', 'tests/shared-nav-menu.test.mjs',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Expected canary changes missing: ' + ', '.join(missing))
          PY
          git diff --check

      - name: Run focused and protected regressions
        run: |
          node --check scripts/shell-runtime-loader.js
          node --test tests/home-runtime-canary.test.mjs
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:home-regressions
          npm run test:nav-magnets
          npm run test:data-integrity

      - name: Stage only validated final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-home-runtime-canary-v5.yml
          git rm scripts/bedrock-home-canary-transform.mjs
          git rm docs/bedrock-diagnostics/home-canary-v4-failure.txt
          git add index.html package.json scripts/build-pages.mjs scripts/inventory.js scripts/shell-runtime-loader.js tests/home-runtime-canary.test.mjs tests/journal-load-graph.test.mjs tests/shared-nav-menu.test.mjs
          git diff --cached --check

      - name: Prove full authoring build reproducibility
        run: |
          npm run build
          git diff --exit-code

      - name: Commit validated Home canary
        run: |
          git commit -m "Defer shared runtime on Home behind preserved shell"
          git push origin HEAD:bedrock/production-finalization-v2
