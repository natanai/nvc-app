name: Bedrock hub magnet prefill migration

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

concurrency:
  group: bedrock-hub-magnet-prefill-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate-hub-prefill:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generalize saved magnet prepaint restore
        run: |
          node scripts/bedrock-migrate-hub-magnet-prefill.mjs
          node --check scripts/build-pages.mjs
          npm run build:pages
          git diff --check

      - name: Verify only canonical compiler and hub outputs changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/build-pages\.mjs|feelings/index\.html|needs/index\.html|faux-feelings/index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths changed by hub prefill migration:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          for required in scripts/build-pages.mjs feelings/index.html needs/index.html faux-feelings/index.html; do
            if ! printf '%s\n' "$changed" | grep -qx "$required"; then
              echo "Expected migration output missing: $required"
              exit 1
            fi
          done

      - name: Verify prepaint contracts and existing regressions
        run: |
          node --test tests/magnet-prepaint.test.mjs
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:generator-ownership

      - name: Prove canonical page build is immediately stable
        shell: bash
        run: |
          before="$(git diff)"
          npm run build:pages
          after="$(git diff)"
          if [ "$before" != "$after" ]; then
            echo "Second canonical page build changed the migration output."
            git diff --stat
            exit 1
          fi

      - name: Commit canonical prepaint migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build-pages.mjs feelings/index.html needs/index.html faux-feelings/index.html
          git commit -m "Preapply saved hub magnet layouts before paint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
