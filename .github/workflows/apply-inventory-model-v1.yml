name: Apply Inventory Model V1 Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-inventory-model-v1.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare and syntax-check Inventory integrator
        run: |
          node scripts/prepare-inventory-model-patcher.mjs
          node --check /tmp/apply-inventory-model-v1.mjs

      - name: Integrate Inventory model prototype
        run: node /tmp/apply-inventory-model-v1.mjs

      - name: Run focused checks
        run: |
          node --check scripts/inventory.js
          npm run test:nav-magnets
          npm run test:flicker-jitter

      - name: Confirm only intended durable files changed
        run: |
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|scripts/inventory\.js|inventory/index\.html)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot integration machinery
        run: git rm .github/workflows/apply-inventory-model-v1.yml scripts/apply-inventory-model-v1.mjs scripts/apply-inventory-model-v1.trigger scripts/prepare-inventory-model-patcher.mjs

      - name: Commit durable Inventory prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs scripts/inventory.js inventory/index.html
          git commit -m "Prototype needs-first Inventory model"
          git push origin HEAD:ux-audit
