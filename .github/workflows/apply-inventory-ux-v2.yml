name: Apply Inventory UX V2 Once

on:
  pull_request:
    branches: [ux-audit]
    types: [opened, synchronize]
    paths:
      - 'scripts/apply-inventory-ux-v2.trigger'

permissions:
  contents: write

jobs:
  apply-inventory-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ux-audit base
        uses: actions/checkout@v4
        with:
          ref: ux-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integrate, regenerate, and smoke-test Inventory
        run: node scripts/apply-inventory-ux-v2.mjs

      - name: Confirm only expected durable files changed
        run: |
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build-pages\.mjs|inventory/index\.html|inventory/journal/index\.html)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-shot integration machinery
        run: git rm .github/workflows/apply-inventory-ux-v2.yml scripts/apply-inventory-ux-v2.mjs scripts/apply-inventory-ux-v2.trigger

      - name: Commit durable Inventory UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pages.mjs inventory/index.html inventory/journal/index.html
          git commit -m "Integrate Inventory UX into generated page"
          git push origin HEAD:ux-audit
