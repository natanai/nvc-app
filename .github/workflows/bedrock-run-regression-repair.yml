name: Bedrock regression repair runner

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/scripts/bedrock-regression-repair.py
      - run: npm run build:pages

      - name: Prove second page build is byte-stable
        run: |
          git diff > /tmp/first.diff
          npm run build:pages
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff

      - name: Validate repair
        run: |
          node --test tests/magnet-prepaint.test.mjs
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          npm run test:performance
          node --test tests/runtime-load-graph.test.mjs
          node --test tests/route-runtime-ownership.test.mjs
          npm run lint:entrypoints

      - name: Commit clean repair
        run: |
          rm .github/workflows/bedrock-run-regression-repair.yml
          rm .github/workflows/bedrock-remove-canonicalization-regressions.yml
          rm .github/scripts/bedrock-regression-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove Bedrock canonicalization paint regressions"
          git push origin HEAD:bedrock/production-finalization-v2
