name: Bedrock canonical data regeneration

on:
  pull_request:
    branches: [inventory-core-overhaul]

permissions:
  contents: write

jobs:
  regenerate-canonical-data:
    if: github.event.pull_request.head.ref == 'bedrock/production-finalization-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Bedrock head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Generate canonical data directly
        run: node scripts/build-data.mjs

      - name: Require only audited data-byte changes
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'data/body-regions.json\ndata/reverse-inference.json'
          if [ "$changed" != "$expected" ]; then
            echo "Expected exactly the two audited canonical data outputs. Got:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Validate canonical data and page behavior
        shell: bash
        run: |
          node tests/data-integrity.test.mjs
          before="$(git diff)"
          node scripts/build-data.mjs
          after_second_data="$(git diff)"
          if [ "$before" != "$after_second_data" ]; then
            echo "Second direct data generation changed the canonical output further."
            exit 1
          fi

          node scripts/build-pages.mjs
          after_pages="$(git diff)"
          if [ "$before" != "$after_pages" ]; then
            echo "Rebuilding pages from semantically equivalent canonical data changed page output."
            git diff --name-only
            exit 1
          fi

      - name: Commit canonical generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/body-regions.json data/reverse-inference.json
          git commit -m "Canonicalize generated data output"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
