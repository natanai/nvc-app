name: Bedrock one-time Home runtime canary final

on:
  push:
    branches:
      - bedrock/production-finalization-v2

permissions:
  contents: write

jobs:
  validate-home-canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bedrock/production-finalization-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply Home canary source transform
        run: node scripts/bedrock-home-canary-transform.mjs

      - name: Make Menu readiness assertion serializer-independent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/shared-nav-menu.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  const inventoryScript = home.indexOf('<script src="scripts/inventory.js" defer></script>');
            const loaderScript = home.indexOf('<script src="scripts/shell-runtime-loader.js" defer></script>');
            const menuScript = home.indexOf('<script defer src="scripts/inventory-core-shell.js"></script>');'''
          new = '''  const inventoryScript = home.indexOf('scripts/inventory.js');
            const loaderScript = home.indexOf('scripts/shell-runtime-loader.js');
            const menuScript = home.indexOf('scripts/inventory-core-shell.js');'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Menu script-order assertion block; found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate declared static output
        run: npm run build:pages

      - name: Verify canary scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/bedrock-one-time-home-runtime-canary-final.yml',
              'index.html', 'package.json', 'scripts/bedrock-home-canary-transform.mjs',
              'scripts/build-pages.mjs', 'scripts/inventory.js', 'scripts/shell-runtime-loader.js',
              'tests/home-runtime-canary.test.mjs', 'tests/journal-load-graph.test.mjs',
              'tests/shared-nav-menu.test.mjs',
          }
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines if len(line) > 3 and not line[3:].startswith('docs/bedrock-diagnostics/')}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected changed paths: ' + ', '.join(unexpected))
          required = {
              'index.html', 'package.json', 'scripts/build-pages.mjs', 'scripts/inventory.js',
              'scripts/shell-runtime-loader.js', 'tests/home-runtime-canary.test.mjs',
              'tests/journal-load-graph.test.mjs', 'tests/shared-nav-menu.test.mjs',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Expected canary paths missing: ' + ', '.join(missing))
          PY
          git diff --check

      - name: Run protected behavior and load-graph suites
        run: |
          node --check scripts/shell-runtime-loader.js
          node --test tests/home-runtime-canary.test.mjs
          npm run test:flicker-jitter
          npm run test:customizer
          npm run test:home-regressions
          npm run test:nav-magnets
          npm run test:data-integrity

      - name: Stage only final source-owned state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bedrock-one-time-home-runtime-canary-final.yml
          git rm scripts/bedrock-home-canary-transform.mjs
          rm -f docs/bedrock-diagnostics/home-canary-source-matches.txt
          rm -f docs/bedrock-diagnostics/home-canary-v4-failure.txt
          rm -f docs/bedrock-diagnostics/home-canary-v5-diagnostic.txt
          git add -u docs/bedrock-diagnostics || true
          git add index.html package.json scripts/build-pages.mjs scripts/inventory.js scripts/shell-runtime-loader.js tests/home-runtime-canary.test.mjs tests/journal-load-graph.test.mjs tests/shared-nav-menu.test.mjs
          git diff --cached --check

      - name: Prove full authoring build is byte-stable
        run: |
          npm run build
          git diff --exit-code

      - name: Commit validated Home canary
        run: |
          git commit -m "Defer shared runtime on Home behind preserved shell"
          git push origin HEAD:bedrock/production-finalization-v2
