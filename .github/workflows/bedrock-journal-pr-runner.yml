name: Bedrock Journal PR runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final root-level Journal refactor
        run: node scripts/.bedrock-journal-native-finalize.mjs

      - name: Regenerate canonical pages
        run: npm run build:pages

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify Journal contract
        run: node --test tests/journal-native-ux.test.mjs

      - name: Run Bedrock regressions
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node tests/body-cues-static-first.test.mjs
          npm run test:generator-ownership
          npm run test:performance
          npm run test:delivery

      - name: Verify canonical authoring build
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Remove all one-shot Bedrock scaffolding
        run: |
          rm -f scripts/.bedrock-journal-native-refactor.mjs
          rm -f scripts/.fix-journal-refactor-patterns.mjs
          rm -f scripts/.bedrock-journal-native-finalize.mjs
          rm -f .github/workflows/bedrock-journal-native-refactor.yml

      - name: Verify obsolete architecture stays gone
        run: npm run test:obsolete

      - name: Commit tested Bedrock result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify Journal metadata and history UX'

      - name: Prove final head is byte deterministic
        run: |
          npm run build
          git diff --exit-code
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Push tested Bedrock head
        run: git push origin HEAD:bedrock/production-finalization-v2
