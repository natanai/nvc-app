name: Bedrock Journal PR runner

on:
  pull_request:
    branches: [inventory-core-overhaul]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bedrock/production-finalization-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bedrock head
        uses: actions/checkout@v7
        with:
          ref: bedrock/production-finalization-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply root-level Journal refactor
        run: node scripts/.bedrock-journal-native-refactor.mjs

      - name: Regenerate canonical pages
        run: npm run build:pages

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify Journal contract
        run: node --test tests/journal-native-ux.test.mjs

      - name: Run Bedrock regressions
        run: |
          npm run test:data-integrity
          npm run test:customizer
          npm run test:flicker-jitter
          npm run test:nav-magnets
          node tests/body-cues-static-first.test.mjs
          npm run test:generator-ownership
          npm run test:obsolete
          npm run test:performance
          npm run test:delivery

      - name: Verify authoring build
        run: npm run build
        env:
          LINK_CHECK_REPORT_ONLY: '1'

      - name: Remove one-shot Bedrock scaffolding
        run: |
          rm scripts/.bedrock-journal-native-refactor.mjs
          rm .github/workflows/bedrock-journal-native-refactor.yml

      - name: Commit and prove clean head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify Journal metadata and history UX'
          npm run build
          git diff --exit-code
          git push origin HEAD:bedrock/production-finalization-v2
        env:
          LINK_CHECK_REPORT_ONLY: '1'
