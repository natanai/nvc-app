name: release-stable-local

on:
  workflow_dispatch:

jobs:
  package-and-release:
    name: Package and publish snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: metadata
        run: |
          timestamp_tag=$(date -u +"%Y%m%d-%H%M%S")
          timestamp_display=$(date -u +"%Y-%m-%d %H:%M UTC")
          archive_name="nvc-app-${timestamp_tag}.zip"

          echo "tag=release-local-${timestamp_tag}" >> "$GITHUB_OUTPUT"
          echo "title=Stable Local Release - ${timestamp_display}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          git archive --format=zip --output="${{ steps.metadata.outputs.archive_name }}" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.title }}
          body: |
            Automated stable local snapshot generated at ${{ steps.metadata.outputs.title }}.
          files: ${{ steps.metadata.outputs.archive_name }}
          draft: false
          prerelease: false
