<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page" data-page-id="recipes">
      <header class="page-header">
        <h1 class="page-title">Recipes</h1>
      </header>

      <section class="controls">
        <details class="category-filter" open>
          <summary class="category-summary">Category</summary>
          <div class="category-body">
            <p>Select a category to filter recipes.</p>
          </div>
        </details>

        <details class="admin-tools">
          <summary class="admin-summary">Family tools</summary>
          <div class="admin-body">
            <p>Import or export family favorites.</p>
          </div>
        </details>
      </section>

      <ul class="recipe-list" id="recipe-list" aria-label="Recipes"></ul>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
