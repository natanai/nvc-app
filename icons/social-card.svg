    <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="116" font-weight="700" letter-spacing="-0.5px" fill="#2D2346" y="128">Explore feelings, needs,</text>
    <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="116" font-weight="700" letter-spacing="-0.5px" fill="#2D2346" y="244">and strategies offline.</text>
