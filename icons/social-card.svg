      <stop offset="100%" stop-color="#E5F9F1" />
    </linearGradient>
    <linearGradient id="doorShadow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D9CFFE" stop-opacity="0.6" />
