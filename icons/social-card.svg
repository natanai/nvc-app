<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">allneeds.app social preview</title>
  <desc id="desc">Wide social sharing card featuring three glowing doorways beside the allneeds.app wordmark and tagline.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF9FF" />
      <stop offset="65%" stop-color="#EFE4FF" />
      <stop offset="100%" stop-color="#E4F8F1" />
    </linearGradient>
    <linearGradient id="cardHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardShadow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D3CCF9" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="48" fill="url(#cardGradient)" />
  <rect width="1200" height="630" rx="48" fill="none" stroke="#DACFF9" stroke-width="2" />
  <rect x="72" y="80" width="432" height="344" rx="140" fill="url(#cardHighlight)" />
  <path d="M72 424c0 82.84 67.16 150 150 150h168c82.84 0 150-67.16 150-150v18c0 82.84-67.16 150-150 150H222C139.16 592 72 524.84 72 442z" fill="url(#cardShadow)" />
