<!DOCTYPE html>
<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Need for Discovery • NeedShare Magnet Explorer</title>
    <meta name="description" content="Browse situations, feelings, and needs in a retro strategy finder inspired by Need Share." />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body data-base-path="../../">
    <a href="#main" class="skip-link">Skip to content</a>
    <div class="page-wrapper">
      <nav class="site-nav" aria-label="Primary">
        <a class="site-nav__link" href="../../">Home</a>
        <a class="site-nav__link" href="../../situations/">Situations</a>
        <a class="site-nav__link" href="../../feelings/">Feelings</a>
        <a class="site-nav__link" href="../../needs/">Needs</a>
        <a class="site-nav__link site-nav__link--inventory" href="../../inventory/">
          Inventory
          <span class="site-nav__count" data-inventory-count hidden>0</span>
        </a>
      </nav>
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="../../">Home</a></li><li><a href="../">Needs</a></li><li aria-current="page">Discovery</li>
        </ol>
      </nav>
      <main id="main" class="page" role="main" data-need-slug="discovery" data-need-name="Discovery" data-need-title="Need for Discovery">
        
      <header class="page-header">
        <h1 class="page-title">Need for Discovery</h1>
        
      </header>
      <section class="strategy-section" aria-labelledby="strategy-heading">
          <h2 id="strategy-heading" class="section-title">Strategies</h2>
          <div class="strategy-list">
            
                  <article class="strategy-card" data-strategy-slug="color-hunt" data-strategy-tags="play|focus|discovery">
                    <h3 class="strategy-card__title">Color hunt</h3>
                    <p class="strategy-card__description">Pick one color and find five items of that color around you.</p>
                    <div class="strategy-card__actions">
                      <button type="button" class="strategy-card__save">+ Save to inventory</button>
                    </div>
                  </article>
                
          </div>
          <p class="inventory-feedback" data-inventory-feedback hidden></p>
        </section>
      <section class="suggestion" aria-labelledby="suggestion-heading">
        <h2 id="suggestion-heading" class="section-title">Share a strategy</h2>
        
      <div class="strategy-form__container" data-strategy-form-container>
        <form id="suggestion-form" class="strategy-form" data-strategy-form>
          <div class="strategy-form__field">
            <label for="suggestion-title">Strategy name</label>
            <input id="suggestion-title" name="title" type="text" required />
          </div>
          <div class="strategy-form__field">
            <label for="suggestion-description">Strategy details</label>
            <div class="strategy-card strategy-card--input">
              <textarea id="suggestion-description" name="description" rows="4" required></textarea>
            </div>
          </div>
          
        <div class="strategy-form__field">
          <label for="suggestion-need">Primary need</label>
          <select id="suggestion-need" name="need" required>
            
            <option value="love-caring">Love/Caring</option><option value="nurturing">Nurturing</option><option value="connection">Connection</option><option value="belonging">Belonging</option><option value="support">Support</option><option value="consideration">Consideration</option><option value="need-for-all-living-things-to-flourish">Need for all living things to flourish</option><option value="inclusion">Inclusion</option><option value="community">Community</option><option value="safety">Safety</option><option value="contribution">Contribution</option><option value="peer-respect">Peer Respect</option><option value="respect">Respect</option><option value="autonomy">Autonomy</option><option value="to-be-seen">To be seen</option><option value="acknowledgement">Acknowledgement</option><option value="appreciation">Appreciation</option><option value="trust">Trust</option><option value="dependability">Dependability</option><option value="honesty">Honesty</option><option value="honor">Honor</option><option value="commitment">Commitment</option><option value="clarity">Clarity</option><option value="accountability">Accountability</option><option value="causality">Causality</option><option value="fairness">Fairness</option><option value="justice">Justice</option><option value="choice">Choice</option><option value="freedom">Freedom</option><option value="reliability">Reliability</option><option value="act-freely">Act Freely</option><option value="choose-freely">Choose Freely</option><option value="understanding">Understanding</option><option value="recognition">Recognition</option><option value="non-judgmental-communication">Non-judgmental Communication</option><option value="need-to-matter">Need to matter</option><option value="friendship">Friendship</option><option value="space">Space</option><option value="peace">Peace</option><option value="serenity">Serenity</option><option value="do-things-at-my-own-pace-and-in-my-own-way">Do things at my own pace and in my own way</option><option value="calm">Calm</option><option value="participation">Participation</option><option value="to-be-heard">To be heard</option><option value="equality">Equality</option><option value="empowerment">Empowerment</option><option value="consistency">Consistency</option><option value="genuineness">Genuineness</option><option value="mattering">Mattering</option><option value="rest">Rest</option><option value="mutuality">Mutuality</option><option value="relaxation">Relaxation</option><option value="closeness">Closeness</option><option value="authenticity">Authenticity</option><option value="self-expression">Self expression</option><option value="integrity">Integrity</option><option value="empathy">Empathy</option><option value="privacy">Privacy</option><option value="order">Order</option><option value="beauty">Beauty</option><option value="control">Control</option><option value="predictability">Predictability</option><option value="accomplishment">Accomplishment</option><option value="physical-fitness">Physical Fitness</option><option value="acceptance">Acceptance</option><option value="growth">Growth</option><option value="security">Security</option><option value="physical-well-being">Physical Well-Being</option><option value="presence">Presence</option><option value="ease">Ease</option><option value="comfort">Comfort</option><option value="relief">Relief</option><option value="strength">Strength</option><option value="effectiveness">Effectiveness</option><option value="grounding">Grounding</option><option value="self-soothing">Self-Soothing</option><option value="stability">Stability</option><option value="regulation">Regulation</option><option value="balance">Balance</option><option value="calmness">Calmness</option><option value="focus">Focus</option><option value="recovery">Recovery</option><option value="orientation">Orientation</option><option value="play">Play</option><option value="discovery" selected>Discovery</option><option value="freshness">Freshness</option><option value="connection-with-nature">Connection with Nature</option><option value="awe">Awe</option><option value="perspective">Perspective</option><option value="awareness">Awareness</option><option value="self-expression">Self-Expression</option><option value="creativity">Creativity</option><option value="self-connection">Self-Connection</option><option value="meaning">Meaning</option><option value="learning">Learning</option><option value="self-compassion">Self-Compassion</option><option value="direction">Direction</option><option value="power-with">Power-with</option><option value="mutual-understanding">Mutual Understanding</option><option value="simplicity">Simplicity</option><option value="spaciousness">Spaciousness</option><option value="sensory-nourishment">Sensory Nourishment</option><option value="curiosity">Curiosity</option><option value="energy">Energy</option><option value="care">Care</option><option value="dignity">Dignity</option><option value="self-acceptance">Self-Acceptance</option><option value="abundance">Abundance</option><option value="mental-space">Mental Space</option><option value="progress">Progress</option><option value="competence">Competence</option><option value="anticipation">Anticipation</option><option value="structure">Structure</option><option value="self-knowledge">Self-Knowledge</option><option value="agency">Agency</option><option value="self-care">Self-Care</option><option value="compassion">Compassion</option><option value="exploration">Exploration</option><option value="stimulation">Stimulation</option><option value="flow">Flow</option><option value="preparation">Preparation</option><option value="deliberation">Deliberation</option><option value="containment">Containment</option><option value="motivation">Motivation</option><option value="practice">Practice</option>
          </select>
        </div>
          
        <div class="strategy-form__row">
          <div class="strategy-form__field">
            <label for="suggestion-name">First name (optional)</label>
            <input id="suggestion-name" name="name" type="text" />
          </div>
          <div class="strategy-form__field">
            <label for="suggestion-location">Location (optional)</label>
            <input id="suggestion-location" name="location" type="text" />
          </div>
        </div>
          <div class="strategy-form__actions">
            <button type="submit" class="strategy-form__submit inventory-button">Save to inventory</button>
          </div>
        </form>
      <p class="strategy-form__message" data-form-message hidden aria-live="polite"></p>
      </div>
      </section>
    
      </main>
    </div>
    <script src="../../scripts/inventory.js" defer></script>
  </body>
